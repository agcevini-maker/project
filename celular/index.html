<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sin Miedo">
<title>Sin Miedo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Prototipo de escritorio (1440x900). Estructura en verde petróleo (barra lateral, hero),
     contenido sobre superficie clara para lectura cómoda, acento verde menta. */
  :root {
    --petrol-900: #0B2A33;
    --petrol-800: #003845;
    --petrol-700: #0E4A57;
    --petrol-600: #1B5F6B;
    --petrol-200: #9FC3C6;
    --mint: #2BB673;
    --mint-600: #1F9D63;
    --mint-100: #DDF4E8;
    --mint-50: #EEF9F3;
    --bg: #F2F6F5;
    --card: #FFFFFF;
    --ink: #0F2229;
    --ink-2: #4A5E64;
    --ink-3: #7A8C91;
    --line: #DCE5E4;
    --red: #D64545;   --red-100: #FBE4E4;
    --amber: #E3A21A; --amber-100: #FCF1D8;
    --green: #2BB673; --green-100: #DDF4E8;
    /* categóricos del simulador (validados para daltonismo) */
    --c-mm: #1F9D63; --c-bono: #2F6FB5; --c-cedear: #C76A12; --c-accion: #B0417A;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(11,42,51,.05), 0 8px 24px rgba(11,42,51,.06);
    --shadow-lg: 0 18px 50px rgba(11,42,51,.16);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.55 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid rgba(43,182,115,.45); outline-offset: 2px; border-radius: 8px; }
  h1, h2, h3, h4 { margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 800; }
  h2 { font-size: 22px; line-height: 1.25; font-weight: 800; }
  h3 { font-size: 17px; line-height: 1.3; font-weight: 700; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .small { font-size: 13.5px; }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  /* Botones y piezas */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--mint); color: #062018; transition: transform .15s, box-shadow .15s, background .15s; text-decoration: none; }
  .btn:hover { background: #33c47f; box-shadow: 0 6px 18px rgba(43,182,115,.3); transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.lg { padding: 15px 26px; font-size: 16px; border-radius: 14px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ghost:hover { border-color: var(--mint); box-shadow: none; background: var(--mint-50); }
  .btn.dark { background: var(--petrol-800); color: #fff; }
  .btn.dark:hover { background: var(--petrol-700); box-shadow: 0 6px 18px rgba(0,56,69,.3); }
  .btn.wa { background: #1FA855; color: #fff; }
  .btn.block { width: 100%; }
  .link { background: none; border: 0; padding: 0; color: var(--mint-600); font-weight: 700; }
  .link:hover { text-decoration: underline; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .card.hover { transition: transform .18s, box-shadow .18s, border-color .18s; }
  .card.hover:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: #c5d6d4; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--mint-100); color: #13774a; white-space: nowrap; }
  .pill.amber { background: var(--amber-100); color: #8a5a00; }
  .pill.red { background: var(--red-100); color: #a52a2a; }
  .pill.grey { background: #EAF0EF; color: var(--ink-2); }
  .pill.petrol { background: var(--petrol-800); color: #fff; }
  .sim-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: var(--amber-100); color: #7a5000; border: 1px solid #f1d58e; }
  .sim-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; }
  .bar { height: 10px; border-radius: 99px; background: #E3ECEA; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--mint); animation: grow .9s cubic-bezier(.2,.8,.2,1); transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .grid { display: grid; gap: 18px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .ic { width: 20px; height: 20px; flex: none; }
  .icon-box { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--mint-50); color: var(--mint-600); flex: none; }
  .icon-box .ic { width: 22px; height: 22px; }
  .note { font-size: 12px; color: var(--ink-3); }

  /* Términos con explicación */
  .term { border-bottom: 2px dotted var(--mint); cursor: help; font-weight: 600; }
  #tip { position: fixed; z-index: 90; max-width: 300px; background: var(--petrol-900); color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; box-shadow: var(--shadow-lg); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  #tip.on { opacity: 1; transform: none; }
  #tip b { color: #7EE2AE; display: block; margin-bottom: 2px; }
  #tip .ex { color: #C5DCDD; margin-top: 6px; display: block; }

  /* ---------- Landing ---------- */
  .landing { background: var(--bg); min-height: 100%; }
  .l-hero { background: radial-gradient(1200px 500px at 80% -10%, #0f4b58 0%, transparent 60%), linear-gradient(180deg, var(--petrol-900), var(--petrol-800)); color: #fff; }
  .l-wrap { max-width: 1240px; margin: 0 auto; padding-inline: 40px; }
  .l-nav { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  .l-nav .row { gap: 24px; }
  .l-nav .logo, .diag-top .logo { padding: 0; }
  .l-nav a, .l-nav .navlink { color: #CFE3E4; text-decoration: none; font-weight: 600; background: none; border: 0; }
  .l-nav .navlink:hover { color: #fff; }
  .l-hero-in { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; padding-block: 48px 84px; }
  .l-hero h1 { font-size: 56px; line-height: 1.04; letter-spacing: -.035em; }
  .l-hero h1 em { font-style: normal; color: var(--mint); }
  .l-hero .lead { font-size: 19px; color: #CFE3E4; margin: 20px 0 30px; max-width: 34ch; }
  .trust { display: flex; gap: 22px; margin-top: 30px; flex-wrap: wrap; color: #A9C7C9; font-size: 13.5px; font-weight: 600; }
  .trust span { display: inline-flex; gap: 8px; align-items: center; }
  .trust .ic { color: var(--mint); width: 18px; height: 18px; }
  .preview { position: relative; height: 430px; }
  .preview .card { position: absolute; color: var(--ink); }
  .l-section { padding-block: 72px; }
  .l-section h2 { font-size: 34px; }
  .frenos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 32px; }
  .freno { display: flex; flex-direction: column; gap: 14px; padding: 26px; }
  .freno .quote { font-size: 15px; color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 12px; font-style: italic; }
  .freno .solve { background: var(--mint-50); border-radius: 12px; padding: 14px; font-size: 14px; }
  .freno .solve b { color: #13774a; display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 32px; }
  .step-n { width: 34px; height: 34px; border-radius: 50%; background: var(--petrol-800); color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 14px; }
  .l-cta { background: var(--petrol-800); color: #fff; border-radius: 24px; padding: 44px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .l-foot { padding-block: 28px 40px; color: var(--ink-3); font-size: 12.5px; display: flex; justify-content: space-between; gap: 20px; }

  /* ---------- Diagnóstico ---------- */
  .diag { min-height: 100%; display: grid; grid-template-rows: auto 1fr; background: linear-gradient(180deg, var(--petrol-900) 0, var(--petrol-900) 220px, var(--bg) 220px); }
  .diag-top { color: #fff; }
  .diag-card { max-width: 760px; margin: 10px auto 40px; width: 100%; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .opt { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; transition: border-color .15s, background .15s, transform .15s; }
  .opt:hover { border-color: #a8d9bf; transform: translateY(-2px); }
  .opt.sel { border-color: var(--mint); background: var(--mint-50); }
  .opt .t { font-weight: 700; }
  .seg-progress { display: flex; gap: 6px; }
  .seg-progress span { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.2); }
  .seg-progress span.on { background: var(--mint); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .input { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; width: 100%; }
  .input:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(43,182,115,.15); }
  .money-in { position: relative; }
  .money-in span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 700; }
  .money-in .input { padding-left: 30px; font-weight: 700; font-size: 18px; }

  /* ---------- App shell ---------- */
  .shell { display: grid; grid-template-columns: 252px minmax(0, 1fr) 316px; height: 100vh; }
  .side { background: var(--petrol-900); color: #DCEBEC; display: flex; flex-direction: column; padding: 22px 16px; gap: 6px; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; color: #fff; }
  .logo b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; display: block; line-height: 1.1; }
  .logo small { color: var(--petrol-200); font-weight: 600; font-size: 12px; }
  .nav-i { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; background: none; border: 0; color: #BFD6D8; font-weight: 600; text-align: left; width: 100%; transition: background .15s, color .15s; }
  .nav-i:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-i.on { background: var(--petrol-700); color: #fff; box-shadow: inset 3px 0 0 var(--mint); }
  .nav-i.on .ic { color: var(--mint); }
  .nav-i .badge { margin-left: auto; font-size: 11px; background: var(--mint); color: #062018; border-radius: 99px; padding: 1px 7px; font-weight: 800; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); }
  .me { display: flex; gap: 10px; align-items: center; padding: 6px 8px; }
  .saved { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--petrol-200); padding: 0 10px; }
  .saved .ic { width: 14px; height: 14px; color: var(--mint); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: var(--petrol-600); flex: none; }
  .main { overflow-y: auto; }
  .main-in { padding: 30px 36px 130px; max-width: 980px; margin: 0 auto; }
  .page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  .page-h p { margin-top: 6px; }
  .rail { background: #fff; border-left: 1px solid var(--line); overflow-y: auto; padding: 26px 22px; display: flex; flex-direction: column; gap: 22px; }
  .rail h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 12px; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; font-weight: 800; }
  .streak-days { display: flex; gap: 6px; margin-top: 12px; }
  .streak-days div { flex: 1; text-align: center; font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .streak-days i { display: block; height: 28px; border-radius: 8px; background: #EEF3F2; margin-bottom: 4px; }
  .streak-days .on i { background: linear-gradient(180deg, #FFB547, #F27B1A); }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: #fff; width: 100%; text-align: left; transition: border-color .15s, background .15s; }
  .todo:hover { border-color: var(--mint); background: var(--mint-50); }
  .todo .chk { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #c7d5d3; flex: none; display: grid; place-items: center; margin-top: 1px; }
  .todo.done { opacity: .6; }
  .todo.done .chk { background: var(--mint); border-color: var(--mint); color: #fff; }
  .todo.done .t { text-decoration: line-through; }

  /* Dashboard */
  .dash { grid-template-columns: repeat(6, 1fr); }
  .span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; }
  .goal-hero { background: linear-gradient(135deg, var(--petrol-800), var(--petrol-700)); color: #fff; border: 0; }
  .goal-hero .bar { background: rgba(255,255,255,.15); }
  .goal-hero .muted { color: #B9D3D5; }
  .big-num { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }

  /* Aprender: camino */
  .path { position: relative; display: flex; flex-direction: column; gap: 22px; padding: 10px 0 20px; }
  .lvl { display: flex; align-items: center; gap: 20px; }
  .lvl:nth-child(4n+2) { padding-left: 120px; } .lvl:nth-child(4n+3) { padding-left: 200px; } .lvl:nth-child(4n+4) { padding-left: 120px; }
  .node { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; position: relative; box-shadow: 0 6px 0 rgba(0,0,0,.12); transition: transform .15s; }
  .node:hover { transform: translateY(-2px); }
  .node .ic { width: 30px; height: 30px; }
  .node.done { background: var(--mint); color: #fff; box-shadow: 0 6px 0 #1b8a55; }
  .node.cur { background: #fff; color: var(--petrol-800); border: 4px solid var(--mint); box-shadow: 0 6px 0 #1b8a55, 0 0 0 0 rgba(43,182,115,.5); animation: pulse 2s infinite; }
  .node.lock { background: #E3EAE9; color: #93A5A8; box-shadow: 0 6px 0 #cdd8d6; cursor: not-allowed; }
  @keyframes pulse { 0% { box-shadow: 0 6px 0 #1b8a55, 0 0 0 0 rgba(43,182,115,.5); } 70% { box-shadow: 0 6px 0 #1b8a55, 0 0 0 16px rgba(43,182,115,0); } 100% { box-shadow: 0 6px 0 #1b8a55, 0 0 0 0 rgba(43,182,115,0); } }
  @media (prefers-reduced-motion: reduce) { .node.cur { animation: none; } .bar > span { animation: none; } }
  .lvl-info { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; min-width: 300px; box-shadow: var(--shadow); }
  .lvl.lockrow .lvl-info { background: #F6F9F8; box-shadow: none; }

  /* Lección */
  .lesson-top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .lp { display: flex; gap: 6px; flex: 1; }
  .lp span { flex: 1; height: 8px; border-radius: 99px; background: #E3ECEA; transition: background .3s; }
  .lp span.on { background: var(--mint); }
  .lcard { padding: 40px 44px; min-height: 340px; display: flex; flex-direction: column; gap: 18px; }
  .lcard h2 { font-size: 28px; }
  .lcard p { font-size: 18px; line-height: 1.65; color: #23383E; }
  .lcard .kicker { display: flex; gap: 14px; align-items: center; }
  .callout { background: var(--mint-50); border-radius: 14px; padding: 16px 18px; font-size: 16px; }
  .callout.red { background: var(--red-100); }
  .callout.amber { background: #FDF3DC; color: #6B4A06; }
  .q-opt { width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px; font-weight: 600; display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s; }
  .q-opt:hover:not(:disabled) { border-color: #a8d9bf; }
  .q-opt .k { width: 30px; height: 30px; border-radius: 8px; background: #EEF3F2; display: grid; place-items: center; font-weight: 800; flex: none; }
  .q-opt.right { border-color: var(--mint); background: var(--mint-50); }
  .q-opt.right .k { background: var(--mint); color: #fff; }
  .q-opt.wrong { border-color: var(--red); background: var(--red-100); }
  .q-opt.wrong .k { background: var(--red); color: #fff; }
  .q-opt:disabled { cursor: default; }
  .fb { border-radius: 14px; padding: 16px 18px; display: flex; gap: 12px; animation: pop .25s ease-out; }
  .fb.ok { background: var(--mint-100); } .fb.no { background: var(--red-100); }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Detector */
  .light { width: 132px; padding: 16px; background: #13252B; border-radius: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; flex: none; }
  .light i { width: 70px; height: 70px; border-radius: 50%; background: #2a3b41; transition: background .3s, box-shadow .3s; }
  .light i.r.on { background: #F05252; box-shadow: 0 0 30px rgba(240,82,82,.7); }
  .light i.y.on { background: #F7C33B; box-shadow: 0 0 30px rgba(247,195,59,.7); }
  .light i.g.on { background: #35CE85; box-shadow: 0 0 30px rgba(53,206,133,.7); }
  .chk-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .chk-row:first-child { border-top: 0; }
  .tri { display: flex; background: #EEF3F2; border-radius: 10px; padding: 3px; gap: 3px; }
  .tri button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .tri button.on.si { background: var(--red); color: #fff; }
  .tri button.on.no { background: var(--mint); color: #062018; }
  .tri button.on.ns { background: var(--amber); color: #3b2a00; }
  .tri.inv button.on.si { background: var(--mint); color: #062018; }
  .tri.inv button.on.no { background: var(--red); color: #fff; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; text-align: left; transition: border-color .15s, background .15s; }
  .chip:hover { border-color: var(--mint); background: var(--mint-50); }
  .placeholder { background: repeating-linear-gradient(45deg, #F6F9F8, #F6F9F8 8px, #EFF4F3 8px, #EFF4F3 16px); border: 1.5px dashed #c5d6d4; border-radius: 12px; padding: 4px 10px; font-weight: 700; color: var(--ink-2); font-size: 13px; }

  /* Simulador */
  .opt4 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .inv { position: relative; overflow: hidden; }
  .inv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
  .inv .icon-box { background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); }
  .risk { display: inline-flex; gap: 3px; align-items: center; }
  .risk i { width: 14px; height: 6px; border-radius: 3px; background: #DCE5E4; }
  .risk i.on { background: var(--c, var(--ink)); }
  input[type=range] { width: 100%; accent-color: var(--c, var(--mint)); }
  .alloc { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; background: #E3ECEA; }
  .alloc div { transition: width .3s; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Esfera flotante: ¿Qué querés aprender hoy? */

  .m-top { display: none; }
/* Versión para celular: se suma al estilo del prototipo al generar celular/index.html. */

    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--petrol-900); color: #fff; }
  .m-top .logo { padding: 0; } .m-top .logo svg { width: 32px; height: 32px; } .m-top .logo b { font-size: 17px; }

// googleClientId: ID de cliente OAuth de Google, para "Continuar con Google" sin Supabase (cuentas en este dispositivo).
// Vacíos = modo prototipo: las cuentas y el progreso se guardan en este dispositivo y Google se simula.
const AUTH_CFG = { supabaseUrl: "", supabaseAnonKey: "", googleClientId: "" };
const ACCOUNTS_KEY = "sinmiedo-cuentas.v1", SESSION_KEY = "sinmiedo-sesion.v1";
const cloudOn = () => !!(AUTH_CFG.supabaseUrl && AUTH_CFG.supabaseAnonKey);
const keyFor = email => "sinmiedo-progreso.v2:" + email.toLowerCase();
/* Guardado del progreso. Siempre en este navegador (localStorage). Abierto en claude.ai, además se guarda
   en la base de datos privada de cada persona (capacidad "db", carpeta data/users/<id>), así el progreso
   sigue ahí al volver, desde cualquier dispositivo. */
const STORE = { db: null, uid: null, cache: {}, queue: {}, busy: {}, status: "local" };
const docKey = k => k.replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190);
async function initStore() {
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    const snap = await db.collection("data/users/" + uid).get();
    snap.docs.forEach(d => { if (d.exists && d.data()) STORE.cache[d.id] = d.data().v; });
    STORE.db = db; STORE.uid = uid; STORE.status = "cloud";
    // Lo que ya estaba guardado solo en este navegador también sube a la cuenta.
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("sinmiedo-") && !(docKey(k) in STORE.cache)) cloudPut(k, JSON.parse(localStorage.getItem(k))); } } catch (e) {}
  } catch (e) { STORE.db = null; }
}
async function cloudPut(k, v) {
  if (!STORE.db) return;
  const id = docKey(k); STORE.cache[id] = v; STORE.queue[id] = v;
  if (STORE.busy[id]) return;
  STORE.busy[id] = true;
  while (id in STORE.queue) {
    const val = STORE.queue[id]; delete STORE.queue[id];
    try { await STORE.db.collection("data/users/" + STORE.uid).doc(id).set({ v: val === undefined ? null : val, at: new Date().toISOString() }); STORE.status = "cloud"; }
    catch (e) { STORE.status = e?.code === "quota_exceeded" ? "full" : "error"; }
  }
  STORE.busy[id] = false; renderSaved();
}
function renderSaved() { const el = document.getElementById("saved"); if (el) el.innerHTML = savedLabel(); }
const savedLabel = () => `${icon("check", "ic")}${STORE.status === "cloud" ? "Progreso guardado en tu cuenta" : STORE.status === "local" ? "Progreso guardado en este dispositivo" : STORE.status === "full" ? "No hay más espacio para guardar" : "No se pudo guardar en la nube; quedó en este dispositivo"}`;
const lsGet = (k, def) => {
  const id = docKey(k);
  if (STORE.db && id in STORE.cache) return STORE.cache[id] ?? def;
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
};
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} cloudPut(k, v); };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} if (STORE.db) { const id = docKey(k); delete STORE.cache[id]; STORE.db.collection("data/users/" + STORE.uid).doc(id).delete().catch(() => {}); } };
const googleReady = () => cloudOn() || !!(AUTH_CFG.googleClientId && location.protocol.startsWith("http"));

async function hashPw(email, pw) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("sinmiedo:" + email.toLowerCase() + ":" + pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return "sin-hash:" + pw.length; }

async function signup(name, email, pw) {
  email = email.trim().toLowerCase(); name = name.trim();

  if (!validEmail(email)) return "Revisá el email: parece que tiene un error.";
  if (pw.length < 8) return "La contraseña tiene que tener al menos 8 caracteres.";
  if (cloudOn()) {
    const { data, error } = await SB.auth.signUp({ email, password: pw, options: { data: { name } } });
    if (error) return error.message;
    if (!data.session) return "OK:Te mandamos un email para confirmar tu cuenta. Confirmalo y después ingresá.";
    startSession({ email, name, id: data.user.id }); return "";
  }
  const accs = lsGet(ACCOUNTS_KEY, {});
  if (accs[email]) return accs[email].pw ? "Ya hay una cuenta con ese email en este dispositivo. Ingresá con tu contraseña." : "Esa cuenta se creó con Google. Tocá “Continuar con Google”.";
  accs[email] = { name, pw: await hashPw(email, pw), created: new Date().toISOString() };
  lsSet(ACCOUNTS_KEY, accs);

  return "";
}
async function login(email, pw) {
  email = email.trim().toLowerCase();
  if (!validEmail(email)) return "Revisá el email.";
  if (cloudOn()) {
    const { data, error } = await SB.auth.signInWithPassword({ email, password: pw });
    if (error) return "El email o la contraseña no coinciden.";
    await cloudLoad(data.user); return "";
  }
  const acc = lsGet(ACCOUNTS_KEY, {})[email];
  if (acc && !acc.pw) return "Esa cuenta se creó con Google. Tocá “Continuar con Google”.";
  if (!acc || acc.pw !== await hashPw(email, pw)) return "El email o la contraseña no coinciden.";
  startSession({ email, name: acc.name });
  return "";
}

async function googleAuth() {
  if (cloudOn()) {
    if (!SB) { authMsg("No se pudo conectar con el servidor de cuentas."); return; }
    const { error } = await SB.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href.split("#")[0] } });

    return;
  }
  if (googleReady()) {
    try {
      if (!window.google?.accounts?.oauth2) await loadScript("https://accounts.google.com/gsi/client");
      window.google.accounts.oauth2.initTokenClient({
        client_id: AUTH_CFG.googleClientId, scope: "openid email profile",
        callback: async r => {
          if (r.error) { authMsg("No se pudo ingresar con Google."); return; }
          try {
            const u = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: "Bearer " + r.access_token } }).then(x => x.json());
            if (!u.email) throw new Error("sin email");
            googleSession(u.email, u.given_name || u.name || "");
          } catch (e) { authMsg("No se pudo leer tu cuenta de Google."); }
        }
      }).requestAccessToken();
    } catch (e) { authMsg("No se pudo cargar el ingreso con Google."); }
    return;
  }
  V.gdemo = true; render();
}

function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = Math.imul(s ^ s >>> 15, 1 | s); x ^= x + Math.imul(x ^ x >>> 7, 61 | x); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

function ringSvg(frac, size = 84) {
  const r = size / 2 - 7, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#E3ECEA" stroke-width="8"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#2BB673" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .8s"/></svg>`;
}

function rail() {
  const dn = S.done.length;
  const todos = [

  return `<aside class="rail">
    <section>

/* ---------- 6. Lección ---------- */
function lesson() {
  const i = V.lvl ?? current(), l = LEVELS[i], step = V.step || 0, total = l.cards.length + 1;
  const isQ = step >= l.cards.length;
  const head = `<div class="lesson-top"><button class="btn ghost" data-go="learn">${icon("back")}Camino</button>
    <div class="lp">${Array.from({ length: total }, (_, k) => `<span class="${k <= step ? "on" : ""}"></span>`).join("")}</div>
    <span class="pill">Nivel ${i + 1} de 6</span></div>`;
  if (!isQ) {
    const c = l.cards[step];
    return `${head}<div class="card lcard">
      <div class="kicker"><div class="icon-box">${icon(i === 2 ? "shield" : "learn")}</div><span class="eyebrow">${esc(l.title)} · Tarjeta ${step + 1} de ${l.cards.length}</span></div>
      <h2>${c.h}</h2><p>${c.p}</p>
      ${c.callout ? `<div class="callout ${c.red ? "red" : ""}">${c.callout}</div>` : ""}
      <p class="small faint" style="margin-top:auto">Tocá las palabras subrayadas para ver qué significan.</p>
    </div>
    <div class="between" style="margin-top:18px">
      ${step > 0 ? `<button class="btn ghost" data-act="lstep" data-d="-1">${icon("back")}Anterior</button>` : "<span></span>"}
      <button class="btn lg" data-act="lstep" data-d="1">${step === l.cards.length - 1 ? "Ir a la pregunta" : "Siguiente"} ${icon("arrow")}</button>
    </div>`;
  }
  const picked = V.picked, ans = picked != null, ok = picked === l.a;
  return `${head}<div class="card lcard">
    <div class="kicker"><div class="icon-box">${icon("star")}</div><span class="eyebrow">Pregunta de práctica</span></div>
    <h2>${l.q}</h2>
    <div class="stack">${l.opts.map((o, k) => `<button class="q-opt ${ans ? (k === l.a ? "right" : k === picked ? "wrong" : "") : ""}" data-pick="${k}" ${ans ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span>${o}</button>`).join("")}</div>
    ${ans ? `<div class="fb ${ok ? "ok" : "no"}"><span>${icon(ok ? "check" : "alert")}</span><div><b>${ok ? "¡Exacto!" : "Casi. Mirá por qué:"}</b><p class="small" style="margin-top:4px">${l.why}</p></div></div>` : ""}
  </div>
  <div class="between" style="margin-top:18px">
    <button class="btn ghost" data-act="lstep" data-d="-1">${icon("back")}Volver a las tarjetas</button>
    ${ans ? (ok ? `<button class="btn lg" data-act="finishLvl">${S.done.includes(i) ? "Listo" : "Completar nivel"} ${icon("check")}</button>` : `<button class="btn lg" data-act="retryQ">Intentar de nuevo</button>`) : `<span class="small faint">Elegí una opción</span>`}
  </div>`;
}

function cpi(i) {
  if (!CPI || CPI.length !== MD.dates.length) {
    const ms = Object.keys(MD.inflation).sort(), lastKnown = ms.length ? MD.inflation[ms[ms.length - 1]] : 2.3;
    CPI = [1]; for (let k = 1; k < MD.dates.length; k++) CPI.push(CPI[k - 1] * (1 + (MD.inflation[MD.dates[k].slice(0, 7)] ?? lastKnown) / 100) ** (1 / 21));
  }
  return CPI[i];
}

/* ---------- Reloj de mercado (horario real de BYMA) ---------- */
function marketStatus() {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: BROKER_CFG.hours.tz, hour: "numeric", minute: "numeric", weekday: "short", hour12: false }).formatToParts(new Date());
  const g = k => parts.find(p => p.type === k)?.value, h = +g("hour") % 24, mi = +g("minute"), mins = h * 60 + mi;
  const weekday = !["Sat", "Sun"].includes(g("weekday")), o = BROKER_CFG.hours.open * 60, c = BROKER_CFG.hours.close * 60;
  const open = weekday && mins >= o && mins < c;
  return { open, time: `${String(h).padStart(2, "0")}:${String(mi).padStart(2, "0")}`,
    label: open ? "Abierto" : !weekday ? "Cerrado · fin de semana" : mins < o ? "Cerrado · abre a las 11 hs" : "Cerrado · cerró a las 17 hs" };
}

/* ---------- Estado del broker ---------- */
function ensureBk() {
  if (!S.bk || S.bk.v !== 2) S.bk = { v: 2, cash: BROKER_CFG.startCash, hold: {}, orders: [], nextId: 10231, start: MD.asOf, lastSeen: MD.asOf, explain: true, view: "quotes", tab: "fci" };
  return S.bk;
}
const units = (a, qty, px) => qty * px / a.per;
function costs(a, gross) {
  if (a.cls === "fci") return { com: 0, der: 0, iva: 0 };
  const com = gross * BROKER_CFG.commission;
  return { com, der: gross * BROKER_CFG.marketRights, iva: com * BROKER_CFG.iva };
}
const pendingSellQty = t => S.bk.orders.filter(o => o.status === "Pendiente" && o.side === "sell" && o.t === t).reduce((s, o) => s + o.qty, 0);
function calc(o) {
  const a = A(o.t), px = o.type === "lim" ? (+o.limit || 0) : (o.side === "buy" ? askPx(o.t) : bidPx(o.t));
  let qty = o.mode === "monto" ? (a.cls === "fci" ? (+o.amount || 0) / px : Math.floor((+o.amount || 0) * a.per / px)) : (+o.qty || 0);
  if (a.cls !== "fci") qty = Math.floor(qty);
  const gross = units(a, qty, px), c = costs(a, gross), fees = c.com + c.der + c.iva;
  const total = o.side === "buy" ? gross + fees : gross - fees;
  const held = (S.bk.hold[o.t]?.qty || 0) - pendingSellQty(o.t);
  let err = "";
  if (!(px > 0)) err = "Ingresá un precio límite.";
  else if (!(qty > 0)) err = o.mode === "monto" ? "Con ese monto no alcanza para 1 unidad." : "Ingresá una cantidad mayor a cero.";
  else if (o.side === "buy" && total > S.bk.cash + 0.01) err = `No te alcanza el saldo disponible (${m2(S.bk.cash)}).`;
  else if (o.side === "sell" && qty > held + 1e-9) err = `Podés vender hasta ${qtyF(a, Math.max(0, held))} ${a.unit}.`;
  return { a, px, qty, gross, ...c, fees, total, after: o.side === "buy" ? S.bk.cash - total : S.bk.cash + total, err };
}
function fill(o, px, date, time) {
  const a = A(o.t), gross = units(a, o.qty, px), c = costs(a, gross), fees = c.com + c.der + c.iva, B = S.bk;
  if (o.side === "buy") {
    const total = gross + fees;
    B.cash += (o.reserved || 0) - total; o.reserved = 0;
    if (B.cash < -0.01) { B.cash += total; Object.assign(o, { status: "Rechazada", why: "Saldo insuficiente" }); return; }
    const h = B.hold[o.t] || (B.hold[o.t] = { qty: 0, cost: 0 }); h.qty += o.qty; h.cost += total;
    Object.assign(o, { status: "Ejecutada", price: px, fees, total, exec: { date, time } });
  } else {
    const h = B.hold[o.t]; if (!h || h.qty < o.qty - 1e-9) { Object.assign(o, { status: "Rechazada", why: "No tenés esa cantidad" }); return; }
    const total = gross - fees; h.cost -= h.cost * o.qty / h.qty; h.qty -= o.qty; if (h.qty < 1e-9) delete B.hold[o.t];
    B.cash += total;
    Object.assign(o, { status: "Ejecutada", price: px, fees, total, exec: { date, time } });
  }
  S.simTouched = true;
}
// Cuando llegan cierres nuevos: se revisan las órdenes limitadas pendientes día por día.
function processNewDays() {
  const B = S.bk; if (!B || B.lastSeen >= MD.asOf) return [];
  const filled = [], from = idxOf(B.lastSeen) + 1;
  for (let i = Math.max(1, from); i <= lastI(); i++) {
    B.orders.filter(o => o.status === "Pendiente").forEach(o => {
      const k = ohlcAt(o.t, i), cl = closeAt(o.t, i), lo = k ? k[2] : cl, hi = k ? k[1] : cl, op = k ? k[0] : cl;
      if (o.side === "buy" && lo <= o.limit) { fill(o, Math.min(op, o.limit), MD.dates[i], "Cierre"); filled.push(o); }
      else if (o.side === "sell" && hi >= o.limit) { fill(o, Math.max(op, o.limit), MD.dates[i], "Cierre"); filled.push(o); }
    });
  }
  B.lastSeen = MD.asOf; save();
  return filled;
}
const holdValue = () => Object.entries(S.bk.hold).reduce((s, [k, h]) => s + units(A(k), h.qty, last(k)), 0);
const reserved = () => S.bk.orders.filter(o => o.status === "Pendiente" && o.side === "buy").reduce((s, o) => s + (o.reserved || 0), 0);
const totalValue = () => S.bk.cash + reserved() + holdValue();
const dayResult = () => Object.entries(S.bk.hold).reduce((s, [k, h]) => s + units(A(k), h.qty, last(k) - prevClose(k)), 0);

/* ---------- ¿Qué tan buen inversor sos? ---------- */
function equitySeries() {
  // Reconstruye el valor de la cartera cada día desde que empezaste, con los precios de cierre reales.
  const B = S.bk, s0 = Math.max(0, idxOf(B.start)), ex = B.orders.filter(o => o.status === "Ejecutada").sort((x, y) => (x.exec.date > y.exec.date ? 1 : -1));
  let cash = BROKER_CFG.startCash; const hold = {}; let k = 0; const out = [];
  for (let i = s0; i <= lastI(); i++) {
    while (k < ex.length && idxOf(ex[k].exec.date) <= i) {
      const o = ex[k++]; if (o.side === "buy") { cash -= o.total; hold[o.t] = (hold[o.t] || 0) + o.qty; } else { cash += o.total; hold[o.t] = (hold[o.t] || 0) - o.qty; }
    }
    out.push({ date: MD.dates[i], v: cash + Object.entries(hold).reduce((s, [t2, q2]) => s + units(A(t2), q2, closeAt(t2, i)), 0) });
  }
  return out;
}
function perfStats() {
  const B = S.bk, eq = equitySeries(), s0 = Math.max(0, idxOf(B.start)), days = eq.length - 1;
  const ret = totalValue() / BROKER_CFG.startCash - 1;
  const infl = cpi(lastI()) / cpi(s0) - 1;
  const mm = MD.close.MM ? closeAt("MM", lastI()) / closeAt("MM", s0) - 1 : 0;
  let peak = -Infinity, dd = 0; eq.forEach(p => { peak = Math.max(peak, p.v); dd = Math.min(dd, p.v / peak - 1); });
  const classes = new Set(Object.keys(B.hold).map(k => A(k).cls)).size;
  const invested = holdValue() / Math.max(1, totalValue());
  const parts = [
    ["Le ganaste a la inflación", Math.max(-25, Math.min(25, (ret - infl) * 500))],
    ["Diversificaste", Math.min(20, classes * 5)],
    ["Invertiste tu plata (no la dejaste quieta)", Math.round(invested * 10)],
    ["Peor caída (resta)", -Math.min(20, Math.abs(dd) * 100)]
  ];
  const score = Math.max(0, Math.min(100, Math.round(50 + parts.reduce((s, p) => s + p[1], 0))));
  const tier = score >= 90 ? "Maestro" : score >= 75 ? "Estratega" : score >= 60 ? "Prudente" : score >= 40 ? "Aprendiz" : "Arrancando";
  return { eq, days, ret, infl, mm, dd, classes, parts, score, tier };
}

  return `<svg width="90" height="28" viewBox="0 0 90 28" aria-label="Últimos 5 días"><polyline points="${pts}" fill="none" stroke="${p[p.length - 1] >= p[0] ? "#1F9D63" : "#D64545"}" stroke-width="1.6"/></svg>`;
}

function placeOrder() {
  const o = V.tk, c = calc(o), B = S.bk, ms = marketStatus();
  if (c.err) return;
  const rec = { id: B.nextId++, t: o.t, side: o.side, type: o.type, limit: o.type === "lim" ? +o.limit : null, qty: c.qty, plazo: o.plazo, created: { date: MD.asOf, time: ms.time }, status: "Pendiente" };
  if (o.side === "buy") { rec.reserved = c.total * (o.type === "lim" ? 1.002 : 1.01); B.cash -= rec.reserved; }
  B.orders.unshift(rec);
  const cur = o.side === "buy" ? askPx(o.t) : bidPx(o.t);
  if (o.type === "mkt" || (o.side === "buy" ? cur <= rec.limit : cur >= rec.limit)) fill(rec, cur, MD.asOf, ms.time);
  save();
  V.tk = { ...o, step: "done", result: rec };
  render();
}

function donut(parts) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1, R = 70, C = 2 * Math.PI * R;
  let off = 0;
  return `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Distribución de la cartera">${parts.map(p => {
    const len = p.v / total * C, gap = parts.length > 1 ? 2 : 0;
    const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${p.name}: ${Math.round(p.v / total * 100)}%</title></circle>`;
    off += len; return s;
  }).join("")}<text x="90" y="86" text-anchor="middle" font-size="12" fill="#7A8C91">Valor total</text><text x="90" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#0F2229">${big(total)}</text></svg>`;
}

function candleChart(el, bars) {
  const W = el.clientWidth || 640, H = 300, L = 74, R = 14, T = 12, Bm = 28;
  const min = Math.min(...bars.map(b => b.l)), max = Math.max(...bars.map(b => b.h)), pad = (max - min) * 0.08 || 1;
  const lo = min - pad, hi = max + pad, n = bars.length;
  const x = i => L + (W - L - R) * ((i + 0.5) / n), y = v => T + (H - T - Bm) * (1 - (v - lo) / (hi - lo));
  const bw = Math.max(2, Math.min(14, (W - L - R) / n * 0.6)), every = Math.ceil(n / Math.max(3, Math.min(7, Math.floor((W - L - R) / 72))));
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de velas">
    ${[0, 1, 2, 3, 4].map(k => { const v = lo + (hi - lo) * k / 4; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EEEC"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#7A8C91">${m2(v)}</text>`; }).join("")}
    ${bars.map((b, i) => { const up = b.c >= b.o, col = up ? "#1F9D63" : "#D64545"; return `<g><title>${b.lab} · Apertura ${m2(b.o)} · Máx ${m2(b.h)} · Mín ${m2(b.l)} · Cierre ${m2(b.c)}</title>
      <line x1="${x(i)}" x2="${x(i)}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${col}" stroke-width="1.3"/>
      <rect x="${x(i) - bw / 2}" y="${y(Math.max(b.o, b.c))}" width="${bw}" height="${Math.max(1.5, Math.abs(y(b.o) - y(b.c)))}" fill="${col}" rx="1.5"/>
      ${i % every === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#7A8C91">${b.lab}</text>` : ""}</g>`; }).join("")}
  </svg></div><div class="legend" style="margin-top:8px"><span><i style="background:#1F9D63"></i>Cerró arriba de la apertura</span><span><i style="background:#D64545"></i>Cerró abajo</span><span class="xs faint">Pasá el mouse por una vela para ver sus datos.</span></div>`;
}

// Si el prototipo está publicado en un servidor, busca el archivo de datos más nuevo (se actualiza cada día hábil).
// Copia pública de los datos que el workflow "Datos de mercado" actualiza cada día hábil.
// La usa la app de escritorio (o el archivo abierto suelto) para traer los precios nuevos.
const DATA_URL = "https://raw.githubusercontent.com/agcevini-maker/project/claude/investment-app-practice-iu56nt/data/mercado.json";
async function refreshMarketData() {
  const paths = /^https?:/.test(location.protocol) ? ["../data/mercado.json", "data/mercado.json", DATA_URL] : [DATA_URL];
  for (const path of paths) {
    try {
      const r = await fetch(new URL(path, location.href), { cache: "no-store" }); if (!r.ok) continue;
      const j = await r.json();
      if (j && j.asOf && (!MD.real || j.asOf > MD.asOf)) { MD = buildMD(j); CPI = null; onNewData(); }
      return;
    } catch (e) { /* sin red o sin archivo: se usan los datos incluidos */ }
  }
}
function onNewData() {
  if (!S.bk) return;
  const before = S.bk.lastSeen, filled = processNewDays();
  if (before && before < MD.asOf) toast(`Llegaron los precios del ${fmtDateLong(MD.asOf)}. Mirá cómo le fue a tu cartera.`);
  filled.forEach(o => setTimeout(() => toast(`Se ejecutó tu orden limitada ${o.id} de ${o.t}`), 2800));
  render();
}

const plain = h => String(h).replace(/<li>/g, "\n- ").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').trim();
function mdLite(t) {
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s.,;:!?)]|$)/g, "$1<i>$2</i>");
  const out = []; let list = null;
  String(t).replace(/\r/g, "").split("\n").forEach(line => {
    const m = line.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if (m) { if (!list) { list = []; out.push(list); } list.push(inline(m[1])); return; }
    list = null;
    if (line.trim()) out.push(inline(line.replace(/^#+\s*/, "")));
  });
  return out.map(x => Array.isArray(x) ? `<ul>${x.map(i => `<li>${i}</li>`).join("")}</ul>` : `<p>${x}</p>`).join("");
}

const CHARTS = {};
function lineChart(id, { labels, series, fmt = money, height = 280, yLabel = "" }) {
  const el = document.getElementById(id); if (!el) return;
  const W = el.clientWidth || 600, H = height, L = 64, R = 18, T = 14, B = 30;
  const all = series.flatMap(s => s.values);
  let min = Math.min(...all), max = Math.max(...all);
  const pad = (max - min) * 0.12 || max * 0.1 || 1; min = Math.max(0, min - pad); max += pad;
  const n = labels.length - 1;
  const x = i => L + (W - L - R) * (n ? i / n : 0), y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const ticks = 4, grid = Array.from({ length: ticks + 1 }, (_, k) => min + (max - min) * k / ticks);
  const xEvery = Math.ceil(labels.length / Math.max(3, Math.min(7, Math.floor((W - L - R) / 72))));
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${series.map(s => s.name).join(" y ")}">
    ${grid.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EEEC"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#7A8C91">${fmt(v)}</text>`).join("")}
    ${labels.map((l, i) => (i % xEvery === 0 && n - i >= xEvery * 0.6) || i === n ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#7A8C91">${l}</text>` : "").join("")}
    ${series.map(s => s.area ? `<path d="M${x(0)},${y(min)} ${s.values.map((v, i) => `L${x(i)},${y(v)}`).join(" ")} L${x(s.values.length - 1)},${y(min)}Z" fill="${s.color}" fill-opacity=".10"/>` : "").join("")}
    ${series.map(s => `<polyline points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5"' : ""}/>`).join("")}
    ${series.map(s => { const i = s.values.length - 1; return `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; }).join("")}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#9DB3B6" stroke-dasharray="3 3" opacity="0"/>
    ${series.map((s, k) => `<circle class="hp" data-k="${k}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2" opacity="0"/>`).join("")}
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/>
  </svg><div class="hover-tip"></div></div>
  <div class="legend" style="margin-top:8px">${series.map(s => `<span><i class="${s.dash ? "dash" : "line"}" style="background:${s.color};border-color:${s.color}"></i>${s.name}</span>`).join("")}</div>`;
  CHARTS[id] = { labels, series, fmt, x, y, L, W, R, n };
}
document.addEventListener("mousemove", e => {
  const hit = e.target.closest?.(".hit");
  document.querySelectorAll(".chart").forEach(c => {
    if (hit && c.contains(hit)) return;
    c.querySelector(".hover-tip")?.classList.remove("on"); c.querySelector(".xh")?.setAttribute("opacity", 0); c.querySelectorAll(".hp").forEach(p => p.setAttribute("opacity", 0));
  });
  if (!hit) return;
  const wrap = hit.closest(".chart"), id = wrap.parentElement.id, C = CHARTS[id]; if (!C) return;
  const svg = wrap.querySelector("svg"), box = svg.getBoundingClientRect(), scale = C.W / box.width;
  const px = (e.clientX - box.left) * scale;
  const i = Math.max(0, Math.min(C.n, Math.round((px - C.L) / (C.W - C.L - C.R) * C.n)));
  const xx = C.x(i);
  wrap.querySelector(".xh").setAttribute("x1", xx); wrap.querySelector(".xh").setAttribute("x2", xx); wrap.querySelector(".xh").setAttribute("opacity", 1);
  wrap.querySelectorAll(".hp").forEach(p => { const s = C.series[+p.dataset.k]; if (s.values[i] == null) return p.setAttribute("opacity", 0); p.setAttribute("cx", xx); p.setAttribute("cy", C.y(s.values[i])); p.setAttribute("opacity", 1); });
  const tip = wrap.querySelector(".hover-tip");
  tip.innerHTML = `<b>${C.labels[i]}</b><br>${C.series.filter(s => s.values[i] != null).map(s => `<i style="background:${s.color}"></i>${s.name}: <b>${C.fmt(s.values[i])}</b>`).join("<br>")}`;
  const top = Math.min(...C.series.filter(s => s.values[i] != null).map(s => C.y(s.values[i])));
  tip.style.left = (xx / scale) + "px"; tip.style.top = (top / scale) + "px"; tip.classList.add("on");
});

function confetti() {

  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#2BB673", "#7EE2AE", "#F7C33B", "#2F6FB5", "#ffffff", "#B0417A"];
  const P = Array.from({ length: 160 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

    case "mmenu": modal(`<div class="row" style="gap:12px"><div class="avatar" style="background:var(--mint);color:#062018;width:44px;height:44px;font-size:16px">${esc(myName()[0].toUpperCase())}</div><div style="min-width:0"><b>${esc(myName())}</b><div class="small muted" style="overflow:hidden;text-overflow:ellipsis">${esc(USER?.email || "")}</div></div></div>
      <p class="small muted" style="margin-top:12px">${savedLabel()}</p>
      <div class="stack" style="gap:8px;margin-top:14px"><button class="btn ghost block" data-act="map">${icon("map")}Mapa del prototipo</button><button class="btn ghost block" data-act="logout">${icon("back")}Cerrar sesión</button><button class="btn block" data-act="closeModal">Cerrar</button></div>`); break;
    case "aiStop": aiCtl?.abort(); break;
    case "chatReset": S.chat = null; save(); render(); break;
    case "reset": { const nm = S.name; S = fresh(); S.name = nm; save(); modal(""); go("diag", { step: 0 }); break; }
    case "demoPort": demoPortfolio(); modal(""); go("sim"); break;
  }
});

function closeDrawer() {
  const d = document.querySelector(".drawer"); if (!d) { V.drawer = false; return; }
  V.drIn = false; d.classList.remove("in"); document.querySelector(".dr-bg")?.classList.add("out");
  setTimeout(() => { V.drawer = false; renderDrawer(); }, 220);
}
function gameClick(el) {
  const d = el.dataset;
  if (d.auth === "google") { if (V.page !== "auth") go("auth", { mode: "signup" }); googleAuth(); return; }
  if (d.act === "gdemoBack") { V.gdemo = false; render(); return; }
  if (d.auth) { V.mode = d.auth; V.authEmail = document.getElementById("au-email")?.value || ""; render(); return; }
  if (d.micro) { V.orb = true; V.micro = d.micro; V.microPick = null; renderOrb(); return; }
  if (d.mpick != null) {
    const m = MICRO.find(x => x.id === V.micro); V.microPick = +d.mpick;
    if (V.microPick === m.a && !S.micro?.[m.id]) { S.micro = S.micro || {}; S.micro[m.id] = true; addXP(10, m.t); }
    renderOrb(); return;
  }
  switch (d.act) {
    case "orb": V.orb = !V.orb; V.micro = null; renderOrb(); break;
    case "orbClose": V.orb = false; V.micro = null; renderOrb(); break;
    case "orbBack": V.micro = null; renderOrb(); break;
    case "chest":
      if (S.chest) { toast("Ya abriste este cofre."); return; }
      if (!S.done.includes(2)) { toast("Completá el nivel 3 para abrir el cofre."); return; }
      S.chest = true; confetti(); addXP(50, "cofre"); render(); break;
    case "logout": logout(); break;
  }
}
function bkClick(b, e) {
  const d = b.dataset, B = S.bk;
  if (d.q) { e.stopPropagation(); const x = TERMS[d.q]; modal(`<h2>${x[0]}</h2><p style="margin:10px 0;font-size:16px">${x[1]}</p><div class="callout" style="font-size:14px">Ejemplo: ${x[2]}</div><button class="btn block" style="margin-top:16px" data-act="closeModal">Entendido</button>`); return; }
  if (d.trade) { e.stopPropagation(); V.tk = newTicket(d.trade, d.side || "buy"); V.drawer = true; V.drIn = false; renderDrawer(); setTimeout(() => { V.drIn = true; document.querySelector(".drawer")?.classList.add("in"); document.querySelector(".drawer input, .drawer button")?.focus(); }, 20); return; }
  if (d.drclose) { closeDrawer(); return; }
  if (d.drgo) { closeDrawer(); B.view = d.drgo; V.sym = null; save(); render(); return; }
  if (d.bkview) { B.view = d.bkview; V.sym = null; save(); render(); return; }
  if (d.bktab) { B.tab = d.bktab; save(); render(); return; }
  if (d.sym) { V.sym = d.sym; V.tk = null; V.range = V.range || "1M"; render(); const m = document.querySelector(".main"); if (m) m.scrollTop = 0; return; }
  if (d.range) { V.range = d.range; render(); return; }
  if (d.cstyle) { V.cstyle = d.cstyle; render(); return; }
  if (d.cancel) { const o = B.orders.find(x => x.id === +d.cancel); if (o && o.status === "Pendiente") { B.cash += o.reserved || 0; o.reserved = 0; o.status = "Cancelada"; save(); render(); } return; }
  if (d.tkf) {
    V.tk[d.tkf] = d.v;
    if (d.tkf === "side") { const keep = V.tk.t; V.tk = newTicket(keep, d.v); }
    if (d.tkf === "type" && d.v === "lim") V.tk.limit = +last(V.tk.t).toFixed(2);
    renderDrawer(true); return;
  }
  switch (d.bkact) {
    case "newTicket": V.tk = newTicket(V.tk.t); renderDrawer(true); break;
    case "review": if (!calc(V.tk).err) { V.tk.step = "review"; renderDrawer(true); } break;
    case "edit": V.tk.step = "form"; renderDrawer(true); break;
    case "confirm": placeOrder(); break;
  }
}

function finishLevel() {
  const i = V.lvl;
  const first = !S.done.includes(i);
  const stars = (V.tries || 1) <= 1 ? 3 : V.tries === 2 ? 2 : 1;
  S.stars = S.stars || {}; S.stars[i] = Math.max(S.stars[i] || 0, stars);
  if (first) { S.done.push(i); S.done.sort((a, b) => a - b); }
  save(); confetti();
  if (first) addXP(50 + (stars === 3 ? 20 : 0), stars === 3 ? "¡a la primera!" : "nivel completo");
  if (allDone() && first) { setTimeout(() => go("leap"), 700); return; }
  modal(`<div class="medal" style="width:76px;height:76px">${icon("star")}</div><h2 style="text-align:center">¡Nivel ${i + 1} completo!</h2><div class="stars big" style="text-align:center">${[1, 2, 3].map(k => `<span class="${k <= stars ? "on" : ""}">★</span>`).join("")}</div>
    <p class="muted" style="text-align:center;margin:8px 0 18px">${first ? `+${50 + (stars === 3 ? 20 : 0)} XP.` : "Buen repaso."} ${allDone() ? "" : `Se desbloqueó el nivel ${current() + 1}: ${LEVELS[current()].title}.`}</p>
    <div class="row"><button class="btn ghost" style="flex:1" data-go="learn" data-act="closeModal">Ver el camino</button>${allDone() ? `<button class="btn" style="flex:1" data-go="leap">Dar el salto</button>` : `<button class="btn" style="flex:1" data-go="lesson">Siguiente nivel</button>`}</div>`);
}
document.getElementById("modal").addEventListener("click", e => { if (e.target.closest("[data-go]")) modal(""); });

function sendAsk(q) {
  q = q.trim(); if (!q || V.aiBusy) return;
  if (AI) { S.chat.push({ me: true, h: q }); askAI(q); return; }
  S.chat.push({ me: true, h: q }); V.typing = true; render(); scrollChat();
  setTimeout(() => { V.typing = false; S.chat.push({ me: false, h: answerFor(q) }); save(); render(); scrollChat(); }, 800);
}
function scrollChat() { const l = document.getElementById("chat-log"); if (l) l.scrollTop = l.scrollHeight; }

document.addEventListener("submit", e => { if (e.target.id === "auth-form") { e.preventDefault(); submitAuth(); return; } if (e.target.id === "gdemo-form") { e.preventDefault(); submitGoogleDemo(); return; } if (e.target.id === "ask-form") { e.preventDefault(); const i = document.getElementById("ask-in"); sendAsk(i.value); } });

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) { S[el.dataset.bind] = el.value; save(); return; }
  if (el.dataset.bk === "explain") { S.bk.explain = el.checked; save(); render(); return; }
  if (el.dataset.tkin && V.tk) {
    const raw = el.value.trim(), v = parseFloat(raw.includes(",") ? raw.replace(/\./g, "").replace(",", ".") : raw.replace(/[^0-9.]/g, ""));
    V.tk[el.dataset.tkin] = isNaN(v) ? 0 : v;
    const c = calc(V.tk), sm = document.querySelector("#drawer #tk-sum"), rv = document.querySelector("#drawer #tk-review");
    if (sm) sm.innerHTML = summary(V.tk, c); if (rv) rv.disabled = !!c.err;
    return;
  }
  if (el.dataset.num) {
    const v = parseInt(el.value.replace(/\D/g, ""), 10) || 0;
    V[el.dataset.num] = Math.min(v, 99999999);
    clearTimeout(window._nt); window._nt = setTimeout(() => {
      const id = el.id; render(); const n = document.getElementById(id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 450);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { modal(""); hideTip(); if (V.drawer) closeDrawer(); if (V.orb) { V.orb = false; renderOrb(); } }
  if ((e.key === "m" || e.key === "M") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) showMap();
});
window.addEventListener("resize", () => mountCharts());

/* ---------- Mapa del prototipo (para presentar) ---------- */
const SCREENS = [
  ["landing", "Landing"], ["auth", "Registro (Google o email)"], ["diag", "Diagnóstico"], ["home", "Inicio"], ["learn", "Aprender"], ["lesson3", "Lección nivel 3"],
  ["scam", "¿Es estafa?"], ["sim", "Simulador"], ["ask", "Preguntá sin vergüenza"], ["leap", "El salto"]
];
function showMap() {
  modal(`<h2>Mapa del prototipo</h2><p class="muted small" style="margin-top:4px">Saltá a cualquier pantalla. Atajo: tecla M.</p>
    <div class="map-grid">${SCREENS.map(([id, l], k) => `<button data-jump="${id}"><b>${k + 1}</b>${l}</button>`).join("")}</div>
    <button class="btn ghost block" style="margin-bottom:10px" data-act="demoPort">Cargar cartera de ejemplo (empezó hace 30 ruedas, con precios reales)</button>
    <div class="row"><button class="btn ghost" style="flex:1" data-act="reset">Reiniciar mi progreso</button><button class="btn" style="flex:1" data-act="closeModal">Cerrar</button></div>`);
}
function demoPortfolio() {
  // Cartera de ejemplo que empezó hace 30 ruedas, comprada con precios de cierre reales de ese día.
  ensureBk(); const B = S.bk, i0 = Math.max(1, lastI() - 30), date = MD.dates[i0];
  S.bk = { ...B, cash: BROKER_CFG.startCash, hold: {}, orders: [], start: date, lastSeen: MD.asOf };
  [["MM", 0, 300000], ["AL30", 200, 0], ["SPY", 6, 0], ["KO", 5, 0], ["GGAL", 30, 0]].forEach(([tk, qty, amt]) => {
    const a = A(tk); if (!a || closeAt(tk, i0) == null) return;
    const px = closeAt(tk, i0), q = a.cls === "fci" ? amt / px : qty;
    const o = { id: S.bk.nextId++, t: tk, side: "buy", type: "mkt", limit: null, qty: q, plazo: "CI", created: { date, time: "11:30" }, status: "Pendiente" };
    fill(o, px, date, "11:30"); S.bk.orders.unshift(o);
  });
  save();
}
function jump(id) {
  if (!USER) startSession({ email: "demo@sinmiedo.app", name: "Agus" }, Object.assign(fresh(), { name: "Agus" }));
  if (id === "auth") { logout(); return go("auth", { mode: "signup" }); }
  if (!S.started && !["landing", "diag"].includes(id)) { S.started = true; S.freno = S.freno || "miedo"; S.exp = S.exp || "nunca"; save(); }
  if (id === "lesson3") return go("lesson", { lvl: 2, step: 0 });
  if (id === "leap") { if (!allDone()) { S.done = [0, 1, 2, 3, 4, 5]; save(); } go("leap"); confetti(); return; }
  if (id === "diag") return go("diag", { step: 0 });
  go(id);
}

(async () => {
  render();
  await initStore();
  await initAuth();
  if (USER && S.bk) processNewDays();
  render();
  refreshMarketData();
  initAI();
  pollLive();
})();
</script>
