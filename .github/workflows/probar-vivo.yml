# Prueba temporal: revisa si las cotizaciones en vivo de data912 responden y si permiten leerlas desde el navegador (CORS).
name: Probar cotizaciones en vivo
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probar-vivo.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in arg_stocks arg_cedears arg_bonds arg_notes; do
            echo "===== $u"
            curl -s -m 20 -D - -o body.json -H "Origin: null" "https://data912.com/live/$u" | grep -i -E "^HTTP|access-control|content-type|cache|date" || true
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('body.json'))
              print('filas', len(d))
              want={'GGAL','YPFD','PAMP','ALUA','SPY','KO','AAPL','MELI','AL30','GD30','S31O6','S28N6','S30N6','S12D6','S15E7','S27F7'}
              for r in d:
                  if r.get('symbol') in want: print(json.dumps(r)[:300])
              print('ejemplo', json.dumps(d[0])[:300])
          except Exception as e:
              print('error', e, open('body.json').read()[:300])
          PY
          done
