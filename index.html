<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin Miedo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: plataforma web de broker. Barra superior con navegación y saldo, cinta de cotizaciones,
     contenido a lo ancho (tabla + panel lateral de operación). En celular pasa a una columna con barra inferior. */
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #0f1a24;
    --muted: #5b6876;
    --line: #dde3e9;
    --head: #0d2a3a;
    --head-ink: #e8f0f5;
    --head-muted: #94adbd;
    --accent: #0b6e4f;
    --accent-ink: #ffffff;
    --accent-soft: #e1f1ea;
    --up: #0a8a56;
    --up-soft: #e0f3ea;
    --down: #cc3535;
    --down-soft: #fbe6e6;
    --warn: #9a5b00;
    --warn-soft: #fbefdc;
    --row-hover: #f5f8fa;
    --shadow: 0 1px 2px rgba(15,26,36,.05), 0 6px 18px rgba(15,26,36,.05);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1117; --card: #151c24; --ink: #e6edf3; --muted: #8b98a6; --line: #26303b;
      --head: #0a1f2b; --head-ink: #e6edf3; --head-muted: #7f98a8;
      --accent: #34c38f; --accent-ink: #06150f; --accent-soft: #12302a;
      --up: #34c38f; --up-soft: #12302a; --down: #ff7070; --down-soft: #3a1b1d;
      --warn: #f2b25c; --warn-soft: #3a2a14; --row-hover: #1a222c; --shadow: 0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1117; --card: #151c24; --ink: #e6edf3; --muted: #8b98a6; --line: #26303b;
    --head: #0a1f2b; --head-ink: #e6edf3; --head-muted: #7f98a8;
    --accent: #34c38f; --accent-ink: #06150f; --accent-soft: #12302a;
    --up: #34c38f; --up-soft: #12302a; --down: #ff7070; --down-soft: #3a1b1d;
    --warn: #f2b25c; --warn-soft: #3a2a14; --row-hover: #1a222c; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  .wrap { max-width: 1320px; margin: 0 auto; padding-inline: 24px; }
  main.wrap { padding-block: 20px 48px; }

  /* Barra superior */
  .topbar { background: var(--head); color: var(--head-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  .topbar .wrap { display: flex; align-items: center; gap: 28px; height: 60px; }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 20px; background: none; border: 0; color: inherit; font-family: inherit; cursor: pointer; padding: 0; }
  .brand span { color: #4fd1a1; }
  .topnav { display: flex; gap: 4px; height: 100%; }
  .topnav button { background: none; border: 0; color: var(--head-muted); font: inherit; font-weight: 600; padding: 0 14px; cursor: pointer; border-bottom: 3px solid transparent; }
  .topnav button:hover { color: var(--head-ink); }
  .topnav button.on { color: var(--head-ink); border-bottom-color: #4fd1a1; }
  .acct { margin-left: auto; display: flex; gap: 22px; align-items: center; font-size: 13px; }
  .acct .k { color: var(--head-muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .acct .v { font-family: var(--mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .sim-badge { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #f2b25c; border: 1px solid rgba(242,178,92,.5); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .topbar .link { color: var(--head-muted); }

  /* Cinta de cotizaciones */
  .tape { background: var(--card); border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; font-size: 13px; }
  .tape-in { display: inline-flex; gap: 28px; padding: 8px 0; animation: tape 60s linear infinite; }
  .tape-in span { display: inline-flex; gap: 6px; }
  .tape b { font-family: var(--mono); }
  @keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .tape-in { animation: none; } }

  /* Tipografía y básicos */
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.02em; text-wrap: balance; }
  h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .xs { font-size: 12px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  .up { color: var(--up); } .down { color: var(--down); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .card.flat { box-shadow: none; background: var(--bg); border-color: transparent; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-align: center; }
  .btn.inline { display: inline-block; width: auto; }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.buy { background: var(--up); color: var(--accent-ink); }
  .btn.sell { background: var(--down); color: #fff; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 4px 0; }
  .link:hover { color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.up { background: var(--up-soft); color: var(--up); }
  .pill.down { background: var(--down-soft); color: var(--down); }
  .pill.grey { background: var(--bg); color: var(--muted); }
  .term { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted var(--accent) 2px; text-underline-offset: 3px; }
  .note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 16px; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-h p { margin: 0; }

  /* Aprender */
  .narrow { max-width: 720px; margin: 0 auto; }
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding-block: 32px; }
  .hero h1 { font-size: 44px; letter-spacing: -.03em; }
  .hero .lead { font-size: 18px; color: var(--muted); max-width: 46ch; }
  .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pillars .card { box-shadow: none; }
  .pillars b { display: block; font-size: 16px; margin-bottom: 2px; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0 16px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 13px 16px; margin-bottom: 8px; font: inherit; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt.sel, .opt.right { border-color: var(--accent); background: var(--accent-soft); }
  .opt.wrong { border-color: var(--down); }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .level { display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .level:hover { border-color: var(--accent); }
  .level.locked { cursor: default; opacity: .55; }
  .level.locked:hover { border-color: var(--line); }
  .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent); border: 2px solid var(--accent); }
  .level.done .dot { background: var(--accent); color: var(--accent-ink); }
  .level.locked .dot { border-color: var(--line); color: var(--muted); background: transparent; }
  .level .t { font-weight: 600; line-height: 1.3; }
  .banner { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner > div { flex: 1 1 360px; min-width: 0; }
  .lesson p { font-size: 18px; line-height: 1.6; }
  .feedback { border-radius: 10px; padding: 12px 14px; margin: 8px 0 12px; }
  .feedback.ok { background: var(--accent-soft); }
  .feedback.no { background: var(--warn-soft); }
  .tip { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .tip > div { flex: 1; min-width: 0; }
  .tip .link { font-size: 13px; padding: 0; flex: none; }

  /* Mercado: tabla + panel */
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .search { flex: 0 1 280px; min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .tbl-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th.r, td.r { text-align: right; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--row-hover); }
  tbody tr.sel { background: var(--accent-soft); }
  tr.group td { background: var(--bg); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 14px; }
  .sym { font-weight: 700; font-family: var(--mono); letter-spacing: .01em; }
  .tname { font-size: 12px; color: var(--muted); max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .flash-up { animation: fu .8s; } .flash-down { animation: fd .8s; }
  @keyframes fu { from { background: var(--up-soft); } to { background: transparent; } }
  @keyframes fd { from { background: var(--down-soft); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash-up, .flash-down { animation: none; } }
  svg.chart { width: 100%; height: 170px; display: block; }
  svg.chart.tall { height: 240px; }
  svg.spark { width: 80px; height: 24px; display: block; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv:first-child { border-top: 0; }
  .kv b { font-weight: 600; text-align: right; }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 7px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button[disabled] { opacity: .4; cursor: not-allowed; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .seg button.on.buy { color: var(--up); } .seg button.on.sell { color: var(--down); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .stepper button { width: 40px; border: 0; background: var(--bg); color: var(--ink); font: inherit; font-size: 18px; cursor: pointer; }
  .stepper input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); text-align: center; font: 600 16px var(--mono); padding: 8px; }
  .ticket { display: flex; flex-direction: column; gap: 12px; }
  .ticket-h { display: flex; justify-content: space-between; align-items: center; }
  .done-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; margin: 4px auto 0; background: var(--up-soft); color: var(--up); }
  .done-ic.pend { background: var(--warn-soft); color: var(--warn); }
  .placeholder { text-align: center; color: var(--muted); padding: 40px 20px; }
  .mobile-back { display: none; }

  /* Cartera */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; margin-top: 2px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: start; }
  .alloc-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 12px 0; gap: 2px; }
  .alloc-list .kv i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }
  .time { display: flex; gap: 6px; }
  .time button { flex: 1; font-size: 14px; padding: 10px 6px; white-space: nowrap; }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }

  /* Diálogos */
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,10,15,.5); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .sheet { background: var(--card); color: var(--ink); width: 100%; max-width: 440px; border-radius: 14px; padding: 22px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; }
  .example { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }

  /* Avisos, pie y extras */
  .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
  .toast { background: var(--ink); color: var(--card); border-radius: 10px; padding: 12px 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: tin .25s ease-out; }
  @keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  footer.foot { border-top: 1px solid var(--line); margin-top: 32px; padding-block: 18px 28px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer.foot .link { font-size: 12px; padding: 0; }
  .ack { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; }
  .ack input { margin-top: 3px; accent-color: var(--warn); }
  .mstat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .mstat div { background: var(--bg); border-radius: 8px; padding: 6px 10px; }
  .mstat .label { font-size: 10px; }
  .legend-line { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend-line i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 6px; vertical-align: middle; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
  .stats .card { box-shadow: none; padding: 14px; }
  .stats .v { font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .gl { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .gl .card { box-shadow: none; }
  .gl h3 { margin: 0 0 4px; font-size: 16px; }
  .thesis { border-left: 3px solid var(--accent); padding-left: 14px; font-size: 17px; margin: 0 0 20px; max-width: 46ch; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--up); margin-right: 6px; box-shadow: 0 0 0 3px var(--up-soft); }

  /* Meta, ¿Y si…?, liga y asistente */
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 200px) 1fr auto; gap: 12px; align-items: center; font-size: 14px; }
  .bar { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; }
  .funnel { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .funnel > div { background: var(--accent-soft); color: var(--accent); font-weight: 600; text-align: center; padding: 10px; border-radius: 8px; font-size: 14px; }
  .ask-fab { position: fixed; right: 20px; bottom: 20px; z-index: 25; background: var(--ink); color: var(--card); border: 0; border-radius: 99px; padding: 12px 18px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .chat-bg { position: fixed; inset: 0; background: rgba(5,10,15,.45); z-index: 45; display: flex; align-items: flex-end; justify-content: flex-end; padding: 20px; }
  .chat { background: var(--card); color: var(--ink); width: 100%; max-width: 420px; height: min(620px, 80vh); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px 12px; border-radius: 12px; font-size: 14px; max-width: 90%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--ink); color: var(--card); }
  .msg.bot { align-self: flex-start; background: var(--bg); }
  textarea.search { font: inherit; }

  /* Navegación inferior y saldo (solo celular) */
  nav.bottom { display: none; }
  .acct-m { display: none; }

  @media (max-width: 1360px) { .hide-l { display: none; } }
  @media (max-width: 1100px) {
    .levels { grid-template-columns: repeat(3, 1fr); }
    .split { grid-template-columns: minmax(0, 1fr) 360px; }
    .acct .hide-t { display: none; }
  }
  @media (max-width: 900px) {
    .wrap { padding-inline: 16px; }
    main.wrap { padding-block: 16px 100px; }
    .topnav, .acct { display: none; }
    .topbar .wrap { height: 52px; justify-content: space-between; }
    .hero { grid-template-columns: 1fr; padding-block: 8px; gap: 20px; }
    .hero h1 { font-size: 32px; }
    .levels { grid-template-columns: 1fr; }
    .level { flex-direction: row; align-items: center; }
    .split { grid-template-columns: 1fr; }
    .split.has-sel .main-col { display: none; }
    .split:not(.has-sel) .side { display: none; }
    .side { position: static; }
    .mobile-back { display: block; }
    .acct-m { display: block; background: var(--head); color: var(--head-ink); font-size: 13px; border-top: 1px solid rgba(255,255,255,.08); }
    .acct-m .wrap { display: flex; gap: 14px; align-items: center; padding-block: 6px 8px; }
    .acct-m .k { color: var(--head-muted); }
    .acct-m .sim-badge { margin-left: auto; font-size: 10px; padding: 2px 6px; }
    /* Tablas: cada fila pasa a ser una tarjeta con todos los datos */
    table.resp thead { display: none; }
    table.resp, .resp tbody, .resp tr, .resp td { display: block; }
    .resp tbody tr:not(.group) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; padding: 14px; border-bottom: 1px solid var(--line); }
    .resp tbody tr:last-child { border-bottom: 0; }
    .resp td { padding: 0; border: 0; white-space: normal; text-align: left; min-width: 0; }
    .resp td.hide-l { display: block; }

function hashRand(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return ((h ^= h >>> 16) >>> 0) / 4294967296;
}

function sgauss(sym, d) {
  const u = Math.max(hashRand(`${SEASON}:${sym}:${d}:a`), 1e-9), v = hashRand(`${SEASON}:${sym}:${d}:b`);

/* ---------- Órdenes (cálculo y ejecución) ---------- */

function newOrder(sym, side) {
  const fci = isFci(sym), held = S.broker.pos[sym]?.qty || 0;
  return {
    name: "order", sym, side, step: "form",
    type: "mkt", plazo: fci ? "24hs" : "CI",
    qty: fci ? 0 : side === "sell" ? Math.max(1, Math.floor(held)) : 1,
    amount: fci ? (side === "sell" ? Math.floor(held * px(sym)) : 10000) : 0,
    limit: +px(sym).toFixed(2)
  };
}

function calc(o) {
  const fci = isFci(o.sym);
  const price = o.type === "lim" ? o.limit : px(o.sym);
  const qty = fci ? (price > 0 ? o.amount / price : 0) : o.qty;
  const gross = qty * price;
  const fee = fci ? 0 : gross * FEE;
  const total = o.side === "buy" ? gross + fee : gross - fee;
  const held = S.broker.pos[o.sym]?.qty || 0;
  let err = "";
  if (!(qty > 0) || !(price > 0)) err = "Ingresá una cantidad mayor a cero.";
  else if (!fci && !Number.isInteger(qty)) err = "La cantidad tiene que ser un número entero.";
  else if (o.side === "buy" && total > S.broker.cash + 1e-6) err = `No te alcanza el saldo disponible (${money(S.broker.cash)}).`;
  else if (o.side === "sell" && qty > held + 1e-6) err = `Tenés ${qtyFmt(o.sym, held)} para ${fci ? "rescatar" : "vender"}.`;
  return { price, qty, gross, fee, total, err };
}

function summaryRows(o, c) {
  const fci = isFci(o.sym);
  return `
    <div class="kv"><span>${fci ? T("cuotaparte", "Cuotapartes") + " (aprox.)" : "Cantidad"}</span><b class="num" data-c="qty">${qtyFmt(o.sym, c.qty)}</b></div>
    <div class="kv"><span>Precio ${o.type === "lim" ? "límite" : "estimado"}</span><b class="num" data-c="price">${money(c.price)}</b></div>
    <div class="kv"><span>Monto</span><b class="num" data-c="gross">${money(c.gross)}</b></div>
    <div class="kv"><span>${T("comisión", "Comisión y derechos")}</span><b class="num" data-c="fee">${fci ? "Incluida en el fondo" : money(c.fee)}</b></div>
    <div class="kv"><span><b>${o.side === "buy" ? "Total a pagar" : "Total a recibir"}</b></span><b class="num" data-c="total">${money(c.total)}</b></div>`;
}

function execute(o, price) {
  const B = S.broker, fci = isFci(o.sym);
  const qty = fci ? o.amount / price : o.qty;
  const gross = qty * price, fee = fci ? 0 : gross * FEE;
  if (o.side === "buy") {
    if (gross + fee > B.cash + 1e-6) return { ok: false, why: "Saldo insuficiente" };
    B.cash -= gross + fee;
    const p = B.pos[o.sym] || (B.pos[o.sym] = { qty: 0, cost: 0 });
    p.qty += qty; p.cost += gross + fee;
    return { ok: true, qty, price, fee, total: gross + fee };
  }
  const p = B.pos[o.sym];
  if (!p || qty > p.qty + 1e-6) return { ok: false, why: "No tenés esa cantidad" };
  if (gross - fee < p.cost * (qty / p.qty) && dayVar(o.sym) < -0.01) B.panic = (B.panic || 0) + 1;
  p.cost -= p.cost * (qty / p.qty);
  p.qty -= qty;
  if (p.qty < 1e-6) delete B.pos[o.sym];
  B.cash += gross - fee;
  return { ok: true, qty, price, fee, total: gross - fee };
}

function checkLimits() {
  const filled = [];
  S.broker.orders.filter(o => o.status === "Pendiente").forEach(o => {
    const p = px(o.sym);
    if (o.side === "buy" ? p <= o.limit : p >= o.limit) {
      const r = execute(o, p);
      Object.assign(o, r.ok ? { status: "Ejecutada", price: r.price, qty: r.qty, fee: r.fee, total: r.total, execDay: S.broker.day } : { status: "Rechazada", why: r.why });
      filled.push(o);
    }
  });
  return filled;
}

function notifyFills(list) {
  list.forEach(o => toast(o.status === "Ejecutada"
    ? `Se ejecutó tu orden límite: ${o.side === "buy" ? "compraste" : "vendiste"} ${qtyFmt(o.sym, o.qty)} ${o.sym} a ${money(o.price)}.`
    : `Tu orden límite de ${o.sym} fue rechazada: ${o.why}.`));
}

function toast(text) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function coach(dayPnl, pnl) {
  if (!Object.keys(S.broker.pos).length) return "";
  if (dayPnl < -equity() * 0.01) return `<div class="feedback no">Hoy bajó bastante. Así se siente la ${T("volatilidad")}. En la vida real, la clave es no vender por miedo.</div>`;
  if (pnl < 0) return `<div class="feedback no">Vas un poco abajo. Es normal: adelantá unos días y mirá qué pasa.</div>`;
  if (S.broker.day >= 40) return `<div class="feedback ok">Llevás ${S.broker.day} días en el simulador. ¿Ves cómo las bajas se mezclan con las subas?</div>`;
  return "";
}

/* ---------- Simulación del tiempo ---------- */

function advance(n, opts = {}) {
  const B = S.broker;
  for (let d = 0; d < n; d++) {
    INSTRUMENTS.forEach(i => {
      const m = S.market[i.sym];
      m.hist.push(m.ref);
      if (m.hist.length > 260) m.hist.shift();
      m.ref = m.ref * (1 + i.mu + i.sigma * sgauss(i.sym, B.day));
      m.px = m.ref;
      m.hi = Math.max(m.px, m.hist[m.hist.length - 1]); m.lo = Math.min(m.px, m.hist[m.hist.length - 1]);
    });
    B.day++;
    notifyFills(checkLimits());
    B.equity.push(equity());
  }
  if (!opts.silent) { save(); render(); }
}

      <p class="big num" style="margin:6px 0">${suggestion()}</p>
      <p class="small muted" style="margin:0">Un monto chico, según lo que nos dijiste al principio. Lo mismo que hiciste en el simulador, ahora con plata real.</p>
    </div>

    ${S.profile?.adult === 1 ? `<div class="card" style="margin-bottom:16px">
      <h2>Invitá a tu mamá, papá o tutor</h2>
      <p class="small muted">En general, los menores necesitan que un adulto les habilite la cuenta. Mandale este mensaje para verlo juntos.</p>
      <textarea class="search" id="invite" rows="4" style="width:100%;resize:vertical" readonly>${esc(inviteText())}</textarea>

/* ---------- Broker ---------- */

function lockedBroker() {
  return `<div class="narrow card" style="margin-top:24px">
    <h1>Simulador de broker</h1>
    <p>Acá vas a operar como en un broker real: ver precios, comprar, vender y seguir tu cartera. Con $100.000 de mentira.</p>
    <p class="small muted">Se desbloquea al terminar el nivel 3 del camino, así llegás sabiendo qué es el riesgo.</p>
    <div class="row">

      <button class="btn ghost" data-act="demo">Abrirlo igual (modo presentación)</button>
    </div>
  </div>`;
}

function market() {
  if (!view.sel && wide()) { view.sel = "SPY"; view.ticket = newOrder("SPY", "buy"); }
  const f = view.filter || "all", q = (view.q || "").trim().toLowerCase();
  const groups = Object.keys(TYPES).filter(t => f === "all" || f === t);
  const rows = groups.map(t => `
    <tr class="group"><td colspan="7">${TYPES[t].name}</td></tr>
    ${INSTRUMENTS.filter(i => i.type === t).map(i => {
      const v = dayVar(i.sym), key = (i.sym + " " + i.name).toLowerCase();
      return `<tr class="click ${view.sel === i.sym ? "sel" : ""}" data-act="select" data-sym="${i.sym}" data-search="${key}" ${q && !key.includes(q) ? "hidden" : ""}>
        <td class="head"><div class="sym">${i.sym}</div><div class="tname">${i.name}</div></td>
        <td class="r num" data-label="Último" data-px="${i.sym}">${money(px(i.sym))}</td>
        <td class="r" data-label="Var. día"><span class="pill ${cls(v)} num" data-var="${i.sym}">${pct(v)}</span></td>
        <td class="r num hide-l" data-label="Cierre ant.">${money(S.market[i.sym].hist.slice(-1)[0])}</td>
        <td data-label="20 días">${spark(i.sym)}</td>
        <td data-label="Riesgo">${riskPill(TYPES[t].risk)}</td>

      </tr>`;
    }).join("")}`).join("");
  return `
    <div class="page-h">
      <div><h1>Mercado</h1><p class="small muted"><span class="status-dot"></span>Mercado abierto (simulado) · Día ${S.broker.day} · Precios en pesos</p></div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="Buscar por nombre o código" value="${esc(view.q || "")}" autocomplete="off">
        <div class="chips">
          <button class="chip ${f === "all" ? "on" : ""}" data-act="filter" data-f="all">Todos</button>
          ${Object.entries(TYPES).map(([k, t]) => `<button class="chip ${f === k ? "on" : ""}" data-act="filter" data-f="${k}">${t.name}</button>`).join("")}
        </div>
      </div>
    </div>
    ${tip("market", `Así se ve el mercado en un broker. Cada fila es algo que podés comprar: el código, la ${T("cotización")} y la ${T("variación")} del día. Los precios se mueven solos mientras mirás. Elegí uno para ver su gráfico y operar.`)}
    <div class="split ${view.sel ? "has-sel" : ""}">
      <div class="main-col">
        <div class="tbl-wrap"><table class="resp">
          <thead><tr><th>Activo</th><th class="r">${T("cotización", "Último")}</th><th class="r">${T("variación", "Var. día")}</th><th class="r hide-m hide-l">Cierre anterior</th><th class="hide-m">20 días</th><th class="hide-m">${T("riesgo", "Riesgo")}</th><th class="hide-m"></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p class="note">Precios simulados con fines educativos. No son cotizaciones reales ni una recomendación de inversión.</p>
      </div>
      <aside class="side">${view.sel ? sidePanel() : ""}</aside>
    </div>`;
}

function sidePanel() {
  const sym = view.sel, i = INS[sym], t = TYPES[i.type], v = dayVar(sym);

  const values = S.market[sym].hist.slice(-RANGES[range]).concat(px(sym));

    <button class="link mobile-back" data-act="unsel">← Volver al mercado</button>
    <div class="card">
      <div class="between">

        ${riskPill(t.risk)}
      </div>
      <div style="margin-top:10px"><span class="big num" data-px="${sym}">${money(px(sym))}</span></div>
      <div class="small"><span class="pill ${cls(v)} num" data-var="${sym}">${pct(v)}</span> <span class="muted">hoy ·</span> <span class="${cls(rv)} num">${pct(rv)}</span> <span class="muted">en ${range}</span></div>

        <div><div class="label">Mín. día</div><div class="num small" data-lo="${sym}">${money(S.market[sym].lo ?? px(sym))}</div></div>
      </div>
      <div class="seg" style="margin:12px 0 8px">${Object.keys(RANGES).map(r => `<button class="${r === range ? "on" : ""}" data-act="range" data-r="${r}">${r}</button>`).join("")}</div>
      ${chart(values, { label: `Precio de ${sym} en ${range}` })}
    </div>
    <div class="card">${ticketHtml()}</div>
    ${pos ? `
    <div class="card">
      <div class="label" style="margin-bottom:4px">Tu tenencia</div>
      <div class="kv"><span>Cantidad</span><b class="num">${qtyFmt(sym, pos.qty)}</b></div>
      <div class="kv"><span>${T("precio promedio", "Precio promedio")}</span><b class="num">${money(pos.cost / pos.qty)}</b></div>
      <div class="kv"><span>Valor hoy</span><b class="num">${money(pos.qty * px(sym))}</b></div>
      <div class="kv"><span>${T("ganancia o pérdida", "Ganancia / pérdida")}</span><b class="num ${cls(pos.qty * px(sym) - pos.cost)}">${money(pos.qty * px(sym) - pos.cost)}</b></div>
    </div>` : ""}
    <div class="card">
      <div class="label" style="margin-bottom:6px">En palabras simples</div>
      <p class="small">${t.simple}</p>
      <div class="kv"><span>Tipo</span><b>${T(t.term, t.short)}</b></div>
      <div class="kv"><span>${T("liquidez", "Liquidez")}</span><b>${i.type === "fci" ? "Alta (24hs)" : "Alta, en horario de mercado"}</b></div>
      <div class="kv"><span>${T("volatilidad", "Volatilidad")}</span><b>${i.sigma < .005 ? "Muy baja" : i.sigma < .015 ? "Media" : "Alta"}</b></div>
    </div>`;
}

/* ---------- Boleta de órdenes ---------- */

function needsAck(o) { return o.side === "buy" && TYPES[INS[o.sym].type].risk > profileRisk(); }
function blocked(o, c) { return !!c.err || (needsAck(o) && !o.ack); }

function ticketHtml() {
  const o = view.ticket, sym = o.sym, fci = isFci(sym), c = calc(o);
  const verb = o.side === "buy" ? (fci ? "Suscribir" : "Comprar") : (fci ? "Rescatar" : "Vender");
  const held = S.broker.pos[sym]?.qty || 0;

  if (o.step === "done") {
    const r = o.result, pend = r.status === "Pendiente", ok = r.status === "Ejecutada";
    return `<div class="ticket">
      <div class="done-ic ${pend ? "pend" : ""}">${pend ? "⏳" : ok ? "✓" : "!"}</div>
      <h2 style="text-align:center;margin:0">${pend ? "Orden enviada" : ok ? "Orden ejecutada" : "Orden rechazada"}</h2>
      <p class="small muted" style="text-align:center;margin:0">${pend
        ? `Tu ${T("orden límite")} queda esperando. Se ejecuta sola si el precio llega a ${money(r.limit)}.`
        : ok ? `${{ Comprar: "Compraste", Vender: "Vendiste", Suscribir: "Suscribiste", Rescatar: "Rescataste" }[verb]} ${qtyFmt(sym, r.qty)} ${fci ? "cuotapartes de " : ""}${sym} a ${money(r.price)}.` : r.why}</p>
      <div>
        <div class="kv"><span>Orden N.º</span><b class="num">${String(r.id).padStart(6, "0")}</b></div>
        <div class="kv"><span>Estado</span><b><span class="pill ${pend ? "warn" : ok ? "up" : "down"}">${r.status}</span></b></div>
        <div class="kv"><span>${o.side === "buy" ? "Total pagado" : "Total recibido"}</span><b class="num">${ok ? money(r.total) : "—"}</b></div>
        <div class="kv"><span>${T("saldo disponible", "Saldo disponible")}</span><b class="num">${money(S.broker.cash)}</b></div>
      </div>
      <div class="row">
        <button class="btn" data-act="newTicket">Nueva orden</button>
        <button class="btn ghost" data-act="tab" data-tab="portfolio">Ver cartera</button>
      </div>
    </div>`;
  }

  if (o.step === "review") return `<div class="ticket">
    <div class="ticket-h"><h2 style="margin:0">Revisá tu orden</h2></div>
    ${tip("review", "En un broker real siempre hay un paso para revisar antes de confirmar. Mirá bien el total: incluye la comisión.")}
    <div>
      <div class="kv"><span>Operación</span><b class="${o.side === "buy" ? "up" : "down"}">${verb}</b></div>
      <div class="kv"><span>Activo</span><b class="sym">${sym}</b></div>
      ${fci ? "" : `<div class="kv"><span>Tipo de orden</span><b>${o.type === "mkt" ? T("orden a mercado", "A mercado") : T("orden límite", "Límite")}</b></div>`}
      <div class="kv"><span>Plazo</span><b>${T(o.plazo.toLowerCase(), o.plazo)}</b></div>
      ${summaryRows(o, c)}
    </div>
    ${c.err ? `<div class="feedback no">${c.err}</div>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="editOrder">Modificar</button>
      <button class="btn ${o.side === "buy" ? "buy" : "sell"}" data-act="confirm" ${c.err ? "disabled" : ""}>Confirmar</button>
    </div>
  </div>`;

  return `<div class="ticket">
    <div class="ticket-h"><span class="label">Boleta de operación</span><span class="xs muted">${T("saldo disponible", "Disponible")}: <b class="num">${money(S.broker.cash)}</b></span></div>
    ${tip("order", `Esto es una orden: le decís al broker qué querés comprar o vender, cuánto y cómo. Tocá las palabras subrayadas si alguna no la conocés.`)}
    <div class="seg">
      <button class="buy ${o.side === "buy" ? "on" : ""}" data-act="side" data-side="buy">${fci ? "Suscribir" : "Comprar"}</button>
      <button class="sell ${o.side === "sell" ? "on" : ""}" data-act="side" data-side="sell" ${held ? "" : "disabled"}>${fci ? "Rescatar" : "Vender"}</button>
    </div>
    ${fci ? "" : `
    <div class="fields">
      <div class="field">
        <span class="label">${T("orden a mercado", "Tipo de orden")}</span>
        <div class="seg">
          <button class="${o.type === "mkt" ? "on" : ""}" data-act="otype" data-t="mkt">Mercado</button>
          <button class="${o.type === "lim" ? "on" : ""}" data-act="otype" data-t="lim">Límite</button>
        </div>
      </div>
      <div class="field">
        <span class="label">Plazo · ${T("ci", "CI")}/${T("24hs")}</span>
        <div class="seg">
          <button class="${o.plazo === "CI" ? "on" : ""}" data-act="plazo" data-p="CI">CI</button>
          <button class="${o.plazo === "24hs" ? "on" : ""}" data-act="plazo" data-p="24hs">24hs</button>
        </div>
      </div>
    </div>`}
    <div class="fields">
      <div class="field">
        <label class="label" for="q">${fci ? "Monto en pesos" : "Cantidad"}</label>
        <div class="stepper">
          <button data-act="step" data-d="-1" aria-label="Restar">−</button>
          <input id="q" inputmode="decimal" value="${fci ? o.amount : o.qty}" data-field="${fci ? "amount" : "qty"}">
          <button data-act="step" data-d="1" aria-label="Sumar">+</button>
        </div>
      </div>
      ${o.type === "lim" ? `
      <div class="field">
        <label class="label" for="lim">${T("orden límite", "Precio límite")}</label>
        <div class="stepper"><input id="lim" inputmode="decimal" value="${o.limit}" data-field="limit"></div>
      </div>` : ""}
    </div>
    ${o.side === "sell" ? `<div class="xs muted">Tenés ${qtyFmt(sym, held)}${fci ? " cuotapartes (" + money(held * px(sym)) + ")" : ""}.</div>` : ""}
    ${o.type === "lim" ? `<div class="xs muted">${o.side === "buy" ? "Se compra solo si el precio baja hasta este valor." : "Se vende solo si el precio sube hasta este valor."}</div>` : ""}
    <div class="card flat" style="padding:10px 14px">${summaryRows(o, c)}</div>
    <div class="feedback no" id="oerr" style="margin:0" ${c.err ? "" : "hidden"}>${c.err}</div>
    ${needsAck(o) ? `<label class="ack"><input type="checkbox" id="ack" ${o.ack ? "checked" : ""}>
      <span>Esto es <b>${RISK[TYPES[INS[sym].type].risk].toLowerCase()}</b> y tu ${T("perfil de inversor")} es <b>${PROFILES[profileRisk()].toLowerCase()}</b>. Entiendo que puedo perder parte de lo que invierto.</span></label>` : ""}
    <button class="btn ${o.side === "buy" ? "buy" : "sell"}" id="review" data-act="review" ${blocked(o, c) ? "disabled" : ""}>Revisar orden</button>
  </div>`;
}

function updateTicket() {
  const o = view.ticket;
  if (view.name !== "market" || !o || o.step !== "form") return;
  const c = calc(o), fci = isFci(o.sym);
  const set = (k, v) => { const el = app.querySelector(`[data-c="${k}"]`); if (el) el.textContent = v; };
  set("qty", qtyFmt(o.sym, c.qty)); set("price", money(c.price)); set("gross", money(c.gross));
  set("fee", fci ? "Incluida en el fondo" : money(c.fee)); set("total", money(c.total));
  const err = app.querySelector("#oerr"); if (err) { err.textContent = c.err; err.hidden = !c.err; }
  const btn = app.querySelector("#review"); if (btn) btn.disabled = blocked(o, c);
}

function placeOrder() {
  const o = view.ticket, c = calc(o), B = S.broker;
  if (c.err) return;
  const rec = { id: B.nextId++, sym: o.sym, side: o.side, type: o.type, plazo: o.plazo, qty: c.qty, amount: o.amount, limit: o.limit, day: B.day, status: "Pendiente" };
  const marketable = o.type === "mkt" || (o.side === "buy" ? px(o.sym) <= o.limit : px(o.sym) >= o.limit);
  if (marketable) {
    const r = execute(o, px(o.sym));
    Object.assign(rec, r.ok ? { status: "Ejecutada", price: r.price, qty: r.qty, fee: r.fee, total: r.total } : { status: "Rechazada", why: r.why });
  }
  B.orders.unshift(rec);
  save();
  view.ticket = { ...o, step: "done", result: rec };
  render();
}

/* ---------- Cartera y movimientos ---------- */

function portfolio() {
  const B = S.broker, total = equity(), inv = posValue();
  const pnl = total - START_CASH;
  const syms = Object.keys(B.pos);
  const byType = {};
  syms.forEach(s => byType[INS[s].type] = (byType[INS[s].type] || 0) + B.pos[s].qty * px(s));
  const dayPnl = syms.reduce((a, s) => a + B.pos[s].qty * (px(s) - prevClose(s)), 0);
  const alloc = Object.entries(byType).map(([t, v]) => ({ name: TYPES[t].name, color: TYPES[t].color, v })).concat({ name: "Pesos disponibles", color: "var(--line)", v: B.cash });
  return `
    <div class="page-h">
      <div><h1>Mi cartera</h1><p class="small muted">Día ${B.day} de simulación</p></div>
      <div class="time" style="min-width:min(100%,360px)">
        <button class="btn ghost" data-act="adv" data-n="1">+1 día</button>
        <button class="btn ghost" data-act="adv" data-n="5">+1 semana</button>
        <button class="btn" data-act="adv" data-n="21">+1 mes</button>
      </div>
    </div>
    ${tip("portfolio", `Esta es tu ${T("cartera")}: todo lo que tenés, cuánto vale hoy y cuánto ganás o perdés. En la vida real esperás; acá podés adelantar el tiempo con los botones de arriba.`)}
    <div class="kpis">
      <div class="card kpi"><div class="label">Valor total</div><div class="v" data-total>${money(total)}</div></div>
      <div class="card kpi"><div class="label">${T("ganancia o pérdida", "Resultado total")}</div><div class="v ${cls(pnl)}" data-pnl>${money(pnl)}</div><div class="xs ${cls(pnl)} num">${pct(pnl / START_CASH)} desde el inicio</div></div>
      <div class="card kpi"><div class="label">Resultado del día</div><div class="v ${cls(dayPnl)}">${money(dayPnl)}</div></div>
      <div class="card kpi"><div class="label">${T("saldo disponible", "Saldo disponible")}</div><div class="v">${money(B.cash)}</div><div class="xs muted num">Invertido: ${money(inv)}</div></div>
    </div>
    ${coach(dayPnl, pnl)}
    <div class="grid-2">
      <div class="card">
        <div class="between"><span class="label">Evolución de tu cartera</span><span class="xs muted">Día 1 a día ${B.day}</span></div>
        ${B.equity.length > 1 ? chart(B.equity.concat(total), { base: START_CASH, label: "Evolución de tu cartera", tall: true,
            ref: B.equity.concat(total).map((_, i) => START_CASH * (1 + INFL) ** Math.min(i, B.day - 1)) }) + `
          <div class="legend-line"><span><i style="border-color:var(--up)"></i>Tu cartera</span><span><i style="border-color:var(--muted);border-top-style:dashed"></i>Lo que pusiste ($100.000)</span><span><i style="border-color:var(--warn);border-top-style:dashed"></i>Lo que necesitás para no perder contra la ${T("inflación")}</span></div>`
          : `<div class="empty small">Comprá algo y adelantá el tiempo para ver cómo se mueve tu plata.</div>`}
      </div>
      <div class="card">
        <span class="label">Distribución</span>
        <div class="alloc-bar">${alloc.map(a => `<div style="width:${a.v / total * 100}%;background:${a.color}" title="${a.name}"></div>`).join("")}</div>
        <div class="alloc-list">${alloc.map(a => `<div class="kv"><span><i style="background:${a.color}"></i>${a.name}</span><b class="num">${nf2.format(a.v / total * 100)}%</b></div>`).join("")}</div>
        <p class="xs muted" style="margin:10px 0 0">Repartir entre distintos tipos es ${T("diversificar")}.</p>
      </div>
    </div>
    <div class="between" style="margin-bottom:8px"><h2 style="margin:0">Tenencias</h2><span><button class="link" data-act="tab" data-tab="activity">Ver movimientos</button> · <button class="link" data-act="tab" data-tab="league">Ver la liga</button></span></div>
    <div class="tbl-wrap">
      ${syms.length ? `<table class="resp">
        <thead><tr><th>Activo</th><th class="r">Cantidad</th><th class="r hide-m">${T("precio promedio", "Precio prom.")}</th><th class="r">Último</th><th class="r hide-m">Var. día</th><th class="r">Valor</th><th class="r">${T("ganancia o pérdida", "Resultado")}</th><th class="hide-m"></th></tr></thead>
        <tbody>${syms.map(s => {
          const p = B.pos[s], val = p.qty * px(s), g = val - p.cost, v = dayVar(s);
          return `<tr class="click" data-act="select" data-sym="${s}">
            <td class="head"><div class="sym">${s}</div><div class="tname">${INS[s].name}</div></td>
            <td class="r num" data-label="Cantidad">${qtyFmt(s, p.qty)}</td>
            <td class="r num" data-label="Precio prom.">${money(p.cost / p.qty)}</td>
            <td class="r num" data-label="Último">${money(px(s))}</td>
            <td class="r" data-label="Var. día"><span class="pill ${cls(v)} num">${pct(v)}</span></td>
            <td class="r num" data-label="Valor">${money(val)}</td>
            <td class="r" data-label="Resultado"><div class="num ${cls(g)}">${money(g)}</div><div class="xs num ${cls(g)}">${pct(g / p.cost)}</div></td>
            <td class="r act full"><button class="btn sm ghost" data-act="sellFrom" data-sym="${s}">${isFci(s) ? "Rescatar" : "Vender"}</button></td>
          </tr>`;
        }).join("")}</tbody>
      </table>` : `<div class="empty small">Todavía no compraste nada.<p></p><button class="btn inline" data-act="tab" data-tab="market">Ir al mercado</button></div>`}
    </div>

function goalPlan(g) {
  const i = SUPUESTOS.inflacionMensual / 100, r = SUPUESTOS.fondoMensual / 100;
  const rows = []; let caj = 0, inv = 0, tCaj = null, tInv = null;
  for (let t = 0; t <= 60; t++) {
    const price = g.target * (1 + i) ** t;
    if (t > 0) { caj += g.monthly; inv = inv * (1 + r) + g.monthly; }
    rows.push({ t, price, caj, inv });
    if (tCaj == null && t > 0 && caj >= price) tCaj = t;
    if (tInv == null && t > 0 && inv >= price) tInv = t;
  }
  return { rows, tCaj, tInv };
}

const months = t => t == null ? "más de 5 años" : t === 1 ? "1 mes" : `${t} meses`;

function lineChart(series, n, label) {
  const W = 640, H = 220, PL = 4, PB = 22;
  const all = series.flatMap(s => s.values.slice(0, n + 1));
  const max = Math.max(...all) * 1.05 || 1;
  const x = t => PL + t / n * (W - PL * 2), y = v => (H - PB) - v / max * (H - PB - 8);
  const ticks = [0, Math.round(n / 4), Math.round(n / 2), Math.round(3 * n / 4), n];
  return `<svg class="chart tall" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}">
    ${[0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`).join("")}
    ${series.map(s => `<polyline points="${s.values.slice(0, n + 1).map((v, t) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="6 4"' : ""} vector-effect="non-scaling-stroke"/>`).join("")}
  </svg>
  <div class="between xs muted num">${ticks.map(t => `<span>${t === 0 ? "Hoy" : t + " m"}</span>`).join("")}</div>
  <div class="legend-line">${series.map(s => `<span><i style="border-color:${s.color};${s.dash ? "border-top-style:dashed" : ""}"></i>${s.name}</span>`).join("")}</div>`;
}

async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    cloud.uid = await user.id();
    cloud.canWrite = (await user.can("data.write")) !== false;
    cloud.db = db;
    db.collection("liga").onSnapshot(snap => {
      cloud.rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (view.name === "league") render();
    }, () => { cloud.err = "No se pudo cargar la liga."; if (view.name === "league") render(); });
  } catch (e) { /* sin liga compartida: se muestra la de ejemplo */ }
}

function scoreInfo() {
  const B = S.broker, total = equity();
  const ret = total / START_CASH - 1, infl = (1 + INFL) ** (B.day - 1) - 1;
  let peak = -Infinity, dd = 0;
  B.equity.concat(total).forEach(v => { peak = Math.max(peak, v); dd = Math.min(dd, v / peak - 1); });
  const types = new Set(Object.keys(B.pos).map(s => INS[s].type)).size;
  const panic = B.panic || 0;
  const parts = [
    ["Rendimiento contra la inflación", 1000 * (ret - infl)],
    ["Peor caída (resta)", -500 * Math.abs(dd)],
    ["Diversificación: tipos distintos", 25 * types],
    ["Ventas en pánico (resta)", -50 * panic]
  ];
  const pts = Math.max(0, Math.round(500 + parts.reduce((a, p) => a + p[1], 0)));
  return { pts, parts, ret, infl, dd, types, panic };
}

const ASK_SUGGESTIONS = ["¿Qué es una acción?", "¿Esto es una estafa? Me ofrecen duplicar mi plata", "¿Puedo perder todo?", "¿Con cuánto se puede empezar?"];

function localAnswer(q) {
  const n = q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const f = FAQ.find(x => x.k.some(k => n.includes(k.normalize("NFD").replace(/[̀-ͯ]/g, ""))));
  if (f) return f.a;
  const g = Object.entries(GLOSSARY).find(([k]) => n.includes(k.normalize("NFD").replace(/[̀-ͯ]/g, "")));
  if (g) return `${g[1][0]} Ejemplo: ${g[1][1]}`;
  return "No tengo esa respuesta guardada. Probá con otras palabras o buscala en el Diccionario. En la versión publicada con link, estas preguntas las responde Claude.";
}

function renderChat() {
  const el = document.getElementById("chat");
  if (!chat.open) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="chat-bg" data-act="askClose"><div class="chat" role="dialog" aria-label="Preguntá sin vergüenza">
    <div class="between"><h3 style="margin:0">Preguntá sin vergüenza</h3><button class="link" data-act="askClose">Cerrar</button></div>
    <p class="xs muted" style="margin:4px 0 10px">Ninguna pregunta es tonta. No guardamos lo que preguntás. Es información general, no un consejo personal de inversión.</p>
    <div class="chat-log" id="chat-log">${chat.msgs.length ? chat.msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join("")
      : `<div class="chips" style="flex-wrap:wrap">${ASK_SUGGESTIONS.map(q => `<button class="chip" data-act="askQ" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`}</div>
    <form class="row" id="chat-form" style="margin-top:10px"><input class="search" style="flex:1" id="chat-in" placeholder="Escribí tu pregunta" autocomplete="off" maxlength="300"><button class="btn inline" ${chat.busy ? "disabled" : ""}>Preguntar</button></form>
  </div></div>`;
  const log = document.getElementById("chat-log"); log.scrollTop = log.scrollHeight;
}

async function askQuestion(q) {
  q = q.trim(); if (!q || chat.busy) return;
  chat.msgs.push({ role: "user", text: q });
  const ans = { role: "bot", text: "Pensando…" };
  chat.msgs.push(ans); chat.busy = true; renderChat();
  let sample = null;
  try { sample = window.claude?.use ? await window.claude.use("sample") : null; } catch (e) {}
  if (!sample) { ans.text = localAnswer(q); chat.busy = false; renderChat(); return; }
  const instructions = `Sos el asistente de "Sin Miedo", una app educativa para chicos y chicas de secundaria en Argentina que quieren aprender a invertir.
Respondé en español rioplatense, con palabras simples, en no más de 110 palabras, y sumá un ejemplo cotidiano.
No recomiendes qué comprar ni des consejos personalizados de inversión. No inventes precios ni datos de mercado.
Si preguntan si algo es una estafa, explicá las señales de alerta (ganancias garantizadas, apuro, pedir claves o transferir a personas) y sugerí consultar a un adulto y verificar que la entidad esté registrada en la CNV.
Si no sabés algo, decilo. Palabras que la app explica: ${Object.keys(GLOSSARY).join(", ")}.`;
  const history = chat.msgs.slice(0, -1).slice(-6).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
  while (history.length && history[0].role !== "user") history.shift();
  history[0] = { role: "user", content: instructions + "\n\nPregunta: " + history[0].content };
  try {
    const r = await sample(history, { cache: false, modelTier: "quick", onText: ({ text }) => { ans.text = text; const last = document.querySelector(".msg.bot:last-child"); if (last) last.textContent = text; } });
    ans.text = r.text;
  } catch (e) {
    ans.text = localAnswer(q);
  }
  chat.busy = false; renderChat();
}

    <h1>Sobre el proyecto</h1>
    <p class="thesis">El miedo no se va leyendo. Se va practicando, con amigos y para algo que te importa.</p>
    <div class="card" style="margin-bottom:16px">
      <h2>Lo honesto</h2>
      <p style="margin:0">Ya existen apps de educación financiera con lecciones y simuladores de inversión. “Lecciones + simulador” solo no es nuevo. Lo distinto está en para qué y con quién se practica:</p>
    </div>
    <div class="pillars" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-bottom:16px">
      <div class="card"><b>1. Una meta real</b><span class="small muted">El viaje de egresados, unas zapatillas, un recital. La app muestra cuánto antes llegás invirtiendo.</span></div>
      <div class="card"><b>2. ¿Y si…?</b><span class="small muted">Con lo que te regalaron en tu cumpleaños: qué hubiera pasado invirtiéndolo, contra tenerlo en el cajón.</span></div>
      <div class="card"><b>3. Liga con amigos</b><span class="small muted">Todos con el mismo mercado y plata de mentira. Gana quien mejor administra, no quien más arriesga.</span></div>
      <div class="card"><b>4. Preguntá sin vergüenza</b><span class="small muted">Lo que da vergüenza preguntar en voz alta: “¿qué es una acción?”, “¿esto es estafa?”.</span></div>
      <div class="card"><b>5. El salto real</b><span class="small muted">Al terminar, la primera inversión real con un monto chico en LBO. Si sos menor, invitás a un adulto.</span></div>
    </div>
    <h2>Cómo se podría vender</h2>
    <div class="tbl-wrap" style="margin-bottom:16px"><table class="resp">
      <thead><tr><th>Quién paga</th><th>Por qué le sirve</th></tr></thead>
      <tbody>
        <tr><td class="head"><b>LBO</b> (principal)</td><td data-label="Por qué le sirve" style="white-space:normal">Clientes nuevos y jóvenes que llegan educados y con confianza. Además entra el adulto que habilita la cuenta.</td></tr>
        <tr><td class="head"><b>Colegios</b></td><td data-label="Por qué le sirve" style="white-space:normal">Educación financiera como programa: la liga se juega por curso y el profe ve el progreso.</td></tr>
        <tr><td class="head"><b>Otras empresas</b> (a futuro)</td><td data-label="Por qué le sirve" style="white-space:normal">Versión con otra marca para bancos o billeteras virtuales.</td></tr>
      </tbody>
    </table></div>
    <h2>La métrica clave</h2>
    <div class="card" style="margin-bottom:16px">
      <div class="funnel">
        <div style="width:100%">Practican en el simulador</div>
        <div style="width:72%">Completan el camino</div>
        <div style="width:44%">Dan el salto a una inversión real</div>
      </div>
      <p class="small muted" style="margin:12px 0 0">¿Cuántos de los que practican se animan a invertir de verdad? Eso es lo que le importa a un negocio. El dibujo es ilustrativo: todavía no hay datos.</p>
    </div>
    <div class="card">
      <h2>Para validar</h2>
      <p style="margin:0">Preguntarle a compañeros si usarían una liga con el curso y para qué meta juntarían plata.</p>
    </div>
  </div>`;
}

/* ---------- Precios en vivo ---------- */

function liveTick() {
  if (!S.market || !S.broker || !brokerOpen() || document.hidden || modal) return;
  INSTRUMENTS.forEach(i => {
    if (i.type === "fci") return;
    const m = S.market[i.sym];
    m.px = 0.7 * m.px + 0.3 * m.ref * (1 + i.sigma * 0.15 * gauss());
    m.hi = Math.max(m.hi ?? m.px, m.px); m.lo = Math.min(m.lo ?? m.px, m.px);
  });
  const filled = checkLimits();
  notifyFills(filled);
  document.querySelectorAll("[data-px]").forEach(el => {
    const s = el.dataset.px, old = parseFloat(el.dataset.last || px(s));
    el.textContent = money(px(s));
    const row = el.closest("tr");
    if (row) { row.classList.remove("flash-up", "flash-down"); void row.offsetWidth; row.classList.add(px(s) >= old ? "flash-up" : "flash-down"); }
    el.dataset.last = px(s);
  });
  document.querySelectorAll("[data-var]").forEach(el => { const v = dayVar(el.dataset.var); el.textContent = pct(v); el.className = `pill ${cls(v)} num`; });
  document.querySelectorAll("[data-var-t]").forEach(el => { const v = dayVar(el.dataset.varT); el.textContent = pct(v); el.className = `${cls(v)} num`; });
  const total = equity(), pnl = total - START_CASH;
  document.querySelectorAll("[data-total], [data-total-h]").forEach(el => el.textContent = money(total));
  document.querySelectorAll("[data-cash-h]").forEach(el => el.textContent = money(S.broker.cash));
  document.querySelectorAll("[data-pnl]").forEach(el => { el.textContent = money(pnl); el.className = `v ${cls(pnl)}`; });
  updateTicket();
  save();
  document.querySelectorAll("[data-hi]").forEach(el => el.textContent = money(S.market[el.dataset.hi].hi ?? px(el.dataset.hi)));
  document.querySelectorAll("[data-lo]").forEach(el => el.textContent = money(S.market[el.dataset.lo].lo ?? px(el.dataset.lo)));
  if (filled.length && view.name !== "market") render();
}
setInterval(liveTick, 2500);

/* =========================================================
   Eventos
   ========================================================= */

function selectSym(sym, side = "buy") {
  go({ name: "market", filter: view.name === "market" ? view.filter : undefined, q: view.name === "market" ? view.q : undefined,
       range: view.range, sel: sym, ticket: newOrder(sym, side) });
}

document.addEventListener("click", e => {
  const term = e.target.closest(".term");
  if (term) { e.stopPropagation(); return openTerm(term.dataset.term); }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || !el.dataset.act) return;
  const act = el.dataset.act, i = +el.dataset.i;
  const tk = view.ticket;
  switch (act) {
    case "close": if (e.target === el) { modal = null; renderModal(); } break;
    case "modalOk": { const f = modal.onOk; modal = null; renderModal(); f(); break; }
    case "start": go({ ...view, step: 0 }); break;
    case "onb":
      view.answers[ONBOARDING[view.step].key] = i;
      if (view.step < ONBOARDING.length - 1) go({ ...view, step: view.step + 1 });
      else { S.profile = view.answers; S.goal = { ...GOALS[view.answers.goal] }; save(); go({ name: "goal" }); }
      break;
    case "path": go({ name: "path" }); break;
    case "lesson": go({ name: "lesson", i }); break;
    case "quiz": go({ name: "quiz", i }); break;
    case "pick": view.picked = i; render(); break;
    case "retry": go({ name: "quiz", i: view.i }); break;
    case "finish":
      if (!S.done.includes(view.i)) S.done.push(view.i);
      if (view.i === 2) ensureBroker();
      save();
      go(view.i === 2 ? { name: "market" } : view.i === LEVELS.length - 1 ? { name: "leap" } : { name: "path" });
      break;
    case "leap": go({ name: "leap" }); break;
    case "project": go({ name: "project" }); break;
    case "wiM": view.whatif = { ...(view.whatif || { amount: 50000 }), m: +el.dataset.m }; render(); break;
    case "leagueSave": leagueSave(); break;
    case "askOpen": chat.open = true; renderChat(); document.getElementById("chat-in")?.focus(); break;
    case "askClose": if (e.target === el || el.tagName === "BUTTON") { chat.open = false; renderChat(); } break;
    case "askQ": askQuestion(el.dataset.q); break;
    case "copyInvite": {
      const ta = app.querySelector("#invite");
      const done = () => toast("Mensaje copiado. Pegalo en WhatsApp o donde quieras.");
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast("Seleccioné el mensaje: copialo con Ctrl+C o mantené apretado."); }); }
      catch (err) { ta.select(); }
      break;
    }
    case "glossary": go({ name: "glossary" }); break;
    case "loadDemo": ask("Cargar ejemplo para presentar", "Se reemplaza lo que haya ahora por un ejemplo: perfil completo, 3 niveles hechos y una cartera con dos meses de historia.", "Cargar ejemplo", loadDemo); break;
    case "lbo": ask("Próximamente", "Acá se abriría el alta en LBO con el monto sugerido. En este prototipo todavía no está conectado.", "Entendido"); break;
    case "reset":
      ask("¿Empezar de cero?", "Se borra tu progreso del camino y el simulador.", "Borrar todo", () => {
        S = fresh(); save(); go({ name: "welcome", step: -1, answers: {} });
      });
      break;
    case "demo": S.demo = true; ensureBroker(); save(); go({ name: "market" }); break;
    case "tab": {
      const t = el.dataset.tab;
      if (t !== "learn" && brokerOpen()) ensureBroker();
      go({ name: t === "learn" ? "path" : t });
      if (t === "league" && brokerOpen()) initCloudOnce();
      break;
    }
    case "tipOk": S.tips[el.dataset.id] = true; save(); render(); break;
    case "filter": view.filter = el.dataset.f; render(); break;
    case "select": e.stopPropagation(); if (view.name !== "market" || view.sel !== el.dataset.sym) selectSym(el.dataset.sym); break;
    case "sellFrom": e.stopPropagation(); selectSym(el.dataset.sym, "sell"); break;
    case "unsel": view.sel = null; render(); window.scrollTo(0, 0); break;
    case "range": view.range = el.dataset.r; render(); break;
    case "side": view.ticket = newOrder(tk.sym, el.dataset.side); render(); break;
    case "newTicket": view.ticket = newOrder(tk.sym, "buy"); render(); break;
    case "otype": tk.type = el.dataset.t; if (tk.type === "lim") tk.limit = +px(tk.sym).toFixed(2); render(); break;
    case "plazo": tk.plazo = el.dataset.p; render(); break;
    case "step": {
      const fci = isFci(tk.sym), d = +el.dataset.d;
      if (fci) tk.amount = Math.max(0, Math.round(tk.amount + d * 1000));
      else tk.qty = Math.max(0, Math.round(tk.qty) + d);
      app.querySelector("#q").value = fci ? tk.amount : tk.qty;
      updateTicket(); break;
    }
    case "review": if (!blocked(tk, calc(tk))) { tk.step = "review"; render(); } break;
    case "editOrder": tk.step = "form"; render(); break;
    case "confirm": placeOrder(); break;
    case "cancel": {
      const o = S.broker.orders.find(x => x.id === +el.dataset.id);
      if (o && o.status === "Pendiente") { o.status = "Cancelada"; save(); render(); }
      break;
    }
    case "adv": advance(+el.dataset.n); break;
    case "resetBroker":
      ask("¿Reiniciar el simulador?", "Vuelve todo a $100.000 de mentira y se borran tus operaciones.", "Reiniciar", () => {
        S.broker = null; S.market = null; ensureBroker(); save(); go({ name: "portfolio" });
      });
      break;
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "gsearch") {
    view.q = e.target.value;
    const q = view.q.trim().toLowerCase();
    app.querySelectorAll("[data-g]").forEach(c => c.hidden = !!q && !c.dataset.g.includes(q));
    return;
  }
  if (e.target.dataset.gf) {
    const f = e.target.dataset.gf, raw = e.target.value;
    S.goal[f] = f === "name" ? raw.slice(0, 40) : Math.max(0, parseInt(raw.replace(/\D/g, ""), 10) || 0);
    save(); clearTimeout(window._gt); window._gt = setTimeout(() => { const id = e.target.id; render(); const el2 = document.getElementById(id); if (el2) { el2.focus(); el2.setSelectionRange?.(el2.value.length, el2.value.length); } }, 500);
    return;
  }
  if (e.target.dataset.wi) {
    view.whatif = { ...(view.whatif || { m: 12 }), amount: Math.max(0, parseInt(e.target.value.replace(/\D/g, ""), 10) || 0) };
    clearTimeout(window._wt); window._wt = setTimeout(() => { render(); const el2 = document.getElementById("wi-amount"); if (el2) { el2.focus(); el2.setSelectionRange?.(el2.value.length, el2.value.length); } }, 500);
    return;
  }
  if (e.target.id === "ack") { view.ticket.ack = e.target.checked; updateTicket(); return; }
  if (e.target.id === "search") {
    view.q = e.target.value;
    const q = view.q.trim().toLowerCase();
    app.querySelectorAll("tr[data-search]").forEach(r => r.hidden = !!q && !r.dataset.search.includes(q));
    return;
  }
  const f = e.target.dataset.field;
  if (f && view.ticket) {
    const raw = e.target.value.trim();
    const v = parseFloat(raw.includes(",") ? raw.replace(/\./g, "").replace(",", ".") : raw);
    view.ticket[f] = isNaN(v) ? 0 : v;
    updateTicket();
  }
});

function loadDemo() {
  S = fresh();
  S.profile = { exp: 0, fear: 0, amount: 1, goal: 0, adult: 1 };
  S.goal = { ...GOALS[0] };
  S.done = [0, 1, 2];
  ensureBroker();
  const buy = (sym, qty, amount) => {
    const o = { sym, side: "buy", type: "mkt", plazo: isFci(sym) ? "24hs" : "CI", qty, amount };
    const r = execute(o, px(sym));
    if (r.ok) S.broker.orders.unshift({ id: S.broker.nextId++, ...o, day: S.broker.day, status: "Ejecutada", price: r.price, qty: r.qty, fee: r.fee, total: r.total });
  };
  buy("MM", 0, 20000); buy("AL30", 15, 0); buy("KO", 1, 0);
  advance(25, { silent: true });
  buy("GGAL", 2, 0);
  advance(15, { silent: true });
  S.broker.orders.unshift({ id: S.broker.nextId++, sym: "YPFD", side: "buy", type: "lim", plazo: "CI", qty: 1, amount: 0,
    limit: +(px("YPFD") * 0.93).toFixed(2), day: S.broker.day, status: "Pendiente" });
  save(); go({ name: "portfolio" });
}

document.addEventListener("submit", e => {
  if (e.target.id !== "chat-form") return;
  e.preventDefault();
  const inp = document.getElementById("chat-in");
  askQuestion(inp.value);
});

let cloudStarted = false;
function initCloudOnce() { if (!cloudStarted) { cloudStarted = true; initCloud(); } }

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && chat.open) { chat.open = false; renderChat(); return; } if (e.key === "Escape" && modal) { modal = null; renderModal(); } });

if (brokerOpen()) ensureBroker();
render();
initCloudOnce();
</script>
