<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin Miedo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: app de celular, una columna; barra de navegación inferior como en un broker. */
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #0f1a24;
    --muted: #5b6876;
    --line: #dde3e9;
    --accent: #0b6e4f;
    --accent-ink: #ffffff;
    --accent-soft: #e1f1ea;
    --up: #0a8a56;
    --up-soft: #e0f3ea;
    --down: #cc3535;
    --down-soft: #fbe6e6;
    --warn: #9a5b00;
    --warn-soft: #fbefdc;
    --shadow: 0 1px 2px rgba(15,26,36,.05), 0 6px 18px rgba(15,26,36,.05);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1117; --card: #151c24; --ink: #e6edf3; --muted: #8b98a6; --line: #26303b;
      --accent: #34c38f; --accent-ink: #06150f; --accent-soft: #12302a;
      --up: #34c38f; --up-soft: #12302a; --down: #ff7070; --down-soft: #3a1b1d;
      --warn: #f2b25c; --warn-soft: #3a2a14; --shadow: 0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1117; --card: #151c24; --ink: #e6edf3; --muted: #8b98a6; --line: #26303b;
    --accent: #34c38f; --accent-ink: #06150f; --accent-soft: #12302a;
    --up: #34c38f; --up-soft: #12302a; --down: #ff7070; --down-soft: #3a1b1d;
    --warn: #f2b25c; --warn-soft: #3a2a14; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  .app { max-width: 460px; margin: 0 auto; padding: 12px 16px 104px; min-height: 100vh; }
  .app.no-nav { padding-bottom: 40px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 19px; }
  .brand span { color: var(--accent); }
  .sim-badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 99px; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 4px; }
  .link:hover { color: var(--ink); }
  h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.02em; text-wrap: balance; }
  h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .xs { font-size: 12px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .card.flat { box-shadow: none; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-align: center; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.buy { background: var(--up); color: var(--accent-ink); }
  .btn.sell { background: var(--down); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font: inherit; cursor: pointer; }
  .opt.sel, .opt.right { border-color: var(--accent); background: var(--accent-soft); }
  .opt.wrong { border-color: var(--down); }

  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.up { background: var(--up-soft); color: var(--up); }
  .pill.down { background: var(--down-soft); color: var(--down); }
  .pill.grey { background: var(--bg); color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }

  /* Camino */
  .level { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .level.locked { cursor: default; opacity: .55; }
  .dot { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent); border: 2px solid var(--accent); }
  .level.done .dot { background: var(--accent); color: var(--accent-ink); }
  .level.locked .dot { border-color: var(--line); color: var(--muted); background: transparent; }
  .level .t { font-weight: 600; line-height: 1.3; }
  .lesson p { font-size: 17px; }
  .term { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted var(--accent) 2px; text-underline-offset: 3px; }

  /* Hojas y diálogos */
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,10,15,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
  .sheet { background: var(--card); color: var(--ink); width: 100%; max-width: 460px; border-radius: 20px 20px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; }
  .example { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-bottom: 14px; }

  .feedback.ok { background: var(--accent-soft); }
  .feedback.no { background: var(--warn-soft); }
  .tip { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .tip > div { flex: 1; min-width: 0; }
  .tip .link { font-size: 13px; flex: none; }

  /* Broker */
  .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .search { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: inherit; margin-bottom: 10px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .list-h { padding: 10px 14px 6px; }
  .tick { display: grid; grid-template-columns: 1fr 56px auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; font: inherit; color: inherit; }
  .tick:first-child { border-top: 0; }
  .tick:hover { background: var(--bg); }
  .sym { font-weight: 700; font-family: var(--mono); letter-spacing: .01em; }
  .tname { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tright { text-align: right; }
  .tright .num { display: block; font-size: 15px; }
  .flash-up { animation: fu .8s; } .flash-down { animation: fd .8s; }
  @keyframes fu { from { background: var(--up-soft); } to { background: transparent; } }
  @keyframes fd { from { background: var(--down-soft); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash-up, .flash-down { animation: none; } }
  svg.chart { width: 100%; height: 160px; display: block; }
  svg.spark { width: 56px; height: 24px; display: block; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kv:first-child { border-top: 0; }
  .kv b { font-weight: 600; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .seg button.on.buy { color: var(--up); } .seg button.on.sell { color: var(--down); }
  .field { margin-bottom: 12px; }
  .field > .label { display: block; margin-bottom: 4px; }
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .stepper button { width: 48px; border: 0; background: var(--bg); color: var(--ink); font: inherit; font-size: 20px; cursor: pointer; }
  .stepper input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); text-align: center; font: 600 18px var(--mono); padding: 10px; }
  .alloc-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 10px 0 8px; gap: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
  .time { display: flex; gap: 6px; }
  .time button { flex: 1; font-size: 14px; padding: 12px 6px; white-space: nowrap; }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .done-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; margin: 8px auto 12px; background: var(--up-soft); color: var(--up); }
  .done-ic.pend { background: var(--warn-soft); color: var(--warn); }

  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.bottom .in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav.bottom button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; padding: 9px 4px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.bottom button.on { color: var(--accent); }
  nav.bottom svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="nav"></div>
<div id="sheet"></div>

<script>
/* =========================================================
   Contenido educativo
   ========================================================= */

const GLOSSARY = {

  { sym: "MM",   name: "Fondo Money Market (ejemplo)",  type: "fci",    base: 118,   mu: 0.0010, sigma: 0.0002 },
  { sym: "RF",   name: "Fondo Renta Fija (ejemplo)",    type: "fci",    base: 245,   mu: 0.0011, sigma: 0.0030 },
  { sym: "AL30", name: "Bono Argentina 2030",           type: "bono",   base: 812,   mu: 0.0008, sigma: 0.0120 },
  { sym: "GD30", name: "Bono Argentina 2030 (ley NY)",  type: "bono",   base: 845,   mu: 0.0008, sigma: 0.0110 },
  { sym: "SPY",  name: "S&P 500 (500 empresas de EE.UU.)", type: "cedear", base: 41850, mu: 0.0009, sigma: 0.0110 },
  { sym: "KO",   name: "Coca-Cola",                     type: "cedear", base: 18920, mu: 0.0007, sigma: 0.0110 },
  { sym: "AAPL", name: "Apple",                         type: "cedear", base: 16340, mu: 0.0009, sigma: 0.0170 },
  { sym: "MELI", name: "MercadoLibre",                  type: "cedear", base: 21480, mu: 0.0010, sigma: 0.0220 },
  { sym: "YPFD", name: "YPF",                           type: "accion", base: 41200, mu: 0.0010, sigma: 0.0270 },
  { sym: "GGAL", name: "Grupo Financiero Galicia",      type: "accion", base: 6180,  mu: 0.0010, sigma: 0.0280 },
  { sym: "PAMP", name: "Pampa Energía",                 type: "accion", base: 3290,  mu: 0.0010, sigma: 0.0250 },
  { sym: "ALUA", name: "Aluar",                         type: "accion", base: 905,   mu: 0.0009, sigma: 0.0240 }
];
const INS = Object.fromEntries(INSTRUMENTS.map(i => [i.sym, i]));
const START_CASH = 100000;
const FEE = 0.006; // comisión + derechos de mercado, valor de ejemplo
const HIST_DAYS = 90;

/* =========================================================
   Estado
   ========================================================= */

const KEY = "sinmiedo.v2";
const fresh = () => ({ profile: null, done: [], demo: false, tips: {}, broker: null, market: null });
let S = load();
let view = S.profile ? { name: "path" } : { name: "welcome", step: -1, answers: {} };
let modal = null;

function load() {
  try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch (e) { return fresh(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function ensureMarket() {
  if (S.market) return;
  const m = {};
  INSTRUMENTS.forEach(i => {
    const hist = [i.base];
    for (let d = 1; d < HIST_DAYS; d++) hist.push(hist[d - 1] * (1 + i.mu + i.sigma * gauss()));
    m[i.sym] = { hist, px: hist[HIST_DAYS - 1] * (1 + i.mu + i.sigma * gauss()) };
  });
  S.market = m;
}
function ensureBroker() {
  ensureMarket();
  if (!S.broker) S.broker = { cash: START_CASH, day: 1, pos: {}, orders: [], equity: [START_CASH], nextId: 1 };
}

const px = sym => S.market[sym].px;
const prevClose = sym => { const h = S.market[sym].hist; return h[h.length - 1]; };
const dayVar = sym => px(sym) / prevClose(sym) - 1;
const isFci = sym => INS[sym].type === "fci";
const posValue = () => Object.entries(S.broker.pos).reduce((a, [s, p]) => a + p.qty * px(s), 0);
const equity = () => S.broker.cash + posValue();

/* =========================================================
   Formato
   ========================================================= */

const nf2 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => (n < -0.005 ? "−$" : "$") + nf2.format(Math.abs(n));
const money0 = n => "$" + Math.round(n).toLocaleString("es-AR");
const pct = n => (n >= 0 ? "+" : "−") + nf2.format(Math.abs(n * 100)) + "%";
const qtyFmt = (sym, q) => isFci(sym) ? nf2.format(q) : Math.round(q).toLocaleString("es-AR");
const cls = n => n >= 0 ? "up" : "down";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const T = (key, label) => `<button class="term" data-term="${key}">${label || key}</button>`;
const withTerms = s => esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, k, l) => T(k, l));

const brokerOpen = () => S.demo || S.done.includes(2);
const pathDone = () => S.done.length === LEVELS.length;

function suggestion() { return ["$5.000", "$10.000", "$20.000", "$30.000"][(S.profile || {}).amount ?? 0]; }
function profileTip() {
  const p = S.profile; if (!p) return "";
  return [
    "Como lo que más te frena es el miedo a perder, prestá atención al nivel 3 y al simulador: ahí probás sin arriesgar nada.",
    "Como las palabras te frenan, fijate: todas las palabras subrayadas se pueden tocar, también adentro del simulador.",
    "Como no sabés por dónde empezar, seguí el camino en orden: en el nivel 5 armamos juntos tu primer paso.",
    "No hace falta mucha plata: se puede empezar con montos chicos. Lo vemos en el nivel 5."
  ][p.fear];
}

function path() {
  const p = S.profile;

  const levels = LEVELS.map((l, i) => {

    const open = i === 0 || S.done.includes(i - 1) || (skippable && i === 1) || done;
    const tag = done ? `<span class="pill">Hecho</span>` :
      (skippable && i === 0) ? `<span class="pill warn">Opcional para vos</span>` :
      i === 2 ? `<span class="pill warn">Desbloquea el simulador</span>` : "";
    return `<div class="card level ${done ? "done" : open ? "" : "locked"}" data-act="${open ? "lesson" : ""}" data-i="${i}">
      <div class="dot">${done ? "✓" : i + 1}</div>
      <div><div class="xs muted">Nivel ${i + 1} · 1 min</div><div class="t">${l.title}</div>${tag}</div>

  }).join("");
  return `
    <h1>Tu camino</h1>
    <div class="progress"><div style="width:${S.done.length / LEVELS.length * 100}%"></div></div>

function spark(sym) {
  const h = S.market[sym].hist.slice(-20).concat(px(sym));
  const min = Math.min(...h), max = Math.max(...h), span = max - min || 1;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * 56).toFixed(1)},${(22 - (v - min) / span * 20).toFixed(1)}`).join(" ");
  const up = h[h.length - 1] >= h[0];
  return `<svg class="spark" viewBox="0 0 56 24" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${up ? "up" : "down"})" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function chart(values, opts = {}) {
  if (values.length < 2) return "";
  const W = 320, H = 160, P = 6;
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const x = i => i / (values.length - 1) * W, y = v => P + (1 - (v - min) / span) * (H - 2 * P - 14);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const up = values[values.length - 1] >= (opts.base ?? values[0]);
  const col = `var(--${up ? "up" : "down"})`;
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${(P + f * (H - 2 * P - 14)).toFixed(1)}" y2="${(P + f * (H - 2 * P - 14)).toFixed(1)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
  const baseLine = opts.base != null ? `<line x1="0" x2="${W}" y1="${y(Math.min(Math.max(opts.base, min), max)).toFixed(1)}" y2="${y(Math.min(Math.max(opts.base, min), max)).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>` : "";
  const last = pts[pts.length - 1].split(",");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${opts.label || "Gráfico de precio"}">
    ${grid}${baseLine}
    <polygon points="0,${H - 14} ${pts.join(" ")} ${W},${H - 14}" fill="${col}" fill-opacity=".1"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${col}"/>
  </svg>
  <div class="between xs muted num"><span>Mín ${money(min)}</span><span>Máx ${money(max)}</span></div>`;
}

/* ---------- Órdenes ---------- */

function newOrder(sym, side) {
  const fci = isFci(sym), held = S.broker.pos[sym]?.qty || 0;
  return {
    name: "order", sym, side, step: "form",
    type: "mkt", plazo: fci ? "24hs" : "CI",
    qty: fci ? 0 : side === "sell" ? Math.max(1, Math.floor(held)) : 1,
    amount: fci ? (side === "sell" ? Math.floor(held * px(sym)) : 10000) : 0,
    limit: +px(sym).toFixed(2)
  };
}

function calc(o) {
  const fci = isFci(o.sym);
  const price = o.type === "lim" ? o.limit : px(o.sym);
  const qty = fci ? (price > 0 ? o.amount / price : 0) : o.qty;
  const gross = qty * price;
  const fee = fci ? 0 : gross * FEE;
  const total = o.side === "buy" ? gross + fee : gross - fee;
  const held = S.broker.pos[o.sym]?.qty || 0;
  let err = "";
  if (!(qty > 0) || !(price > 0)) err = "Ingresá una cantidad mayor a cero.";
  else if (!fci && !Number.isInteger(qty)) err = "La cantidad tiene que ser un número entero.";
  else if (o.side === "buy" && total > S.broker.cash + 1e-6) err = `No te alcanza el saldo disponible (${money(S.broker.cash)}).`;
  else if (o.side === "sell" && qty > held + 1e-6) err = `Tenés ${qtyFmt(o.sym, held)} para ${fci ? "rescatar" : "vender"}.`;
  return { price, qty, gross, fee, total, err };
}

function updateTicket() {
  if (view.name !== "order" || view.step !== "form") return;
  const c = calc(view), fci = isFci(view.sym);
  const set = (k, v) => { const el = app.querySelector(`[data-c="${k}"]`); if (el) el.textContent = v; };
  set("qty", qtyFmt(view.sym, c.qty)); set("price", money(c.price)); set("gross", money(c.gross));
  set("fee", fci ? "Incluida en el fondo" : money(c.fee)); set("total", money(c.total));
  const err = app.querySelector("#oerr"); err.textContent = c.err; err.hidden = !c.err;
  app.querySelector("#review").disabled = !!c.err;
}

function execute(o, price) {
  const B = S.broker, fci = isFci(o.sym);
  const qty = fci ? o.amount / price : o.qty;
  const gross = qty * price, fee = fci ? 0 : gross * FEE;
  if (o.side === "buy") {
    if (gross + fee > B.cash + 1e-6) return { ok: false, why: "Saldo insuficiente" };
    B.cash -= gross + fee;
    const p = B.pos[o.sym] || (B.pos[o.sym] = { qty: 0, cost: 0 });
    p.qty += qty; p.cost += gross + fee;
    return { ok: true, qty, price, fee, total: gross + fee };
  }
  const p = B.pos[o.sym];
  if (!p || qty > p.qty + 1e-6) return { ok: false, why: "No tenés esa cantidad" };
  p.cost -= p.cost * (qty / p.qty);
  p.qty -= qty;
  if (p.qty < 1e-6) delete B.pos[o.sym];
  B.cash += gross - fee;
  return { ok: true, qty, price, fee, total: gross - fee };
}

function placeOrder() {
  const o = view, c = calc(o), B = S.broker;
  if (c.err) return;
  const rec = { id: B.nextId++, sym: o.sym, side: o.side, type: o.type, plazo: o.plazo, qty: c.qty, amount: o.amount, limit: o.limit, day: B.day, status: "Pendiente" };
  const marketable = o.type === "mkt" || (o.side === "buy" ? px(o.sym) <= o.limit : px(o.sym) >= o.limit);
  if (marketable) {
    const r = execute(o, px(o.sym));
    Object.assign(rec, r.ok ? { status: "Ejecutada", price: r.price, qty: r.qty, fee: r.fee, total: r.total } : { status: "Rechazada", why: r.why });
  }
  B.orders.unshift(rec);
  save();
  view = { ...o, step: "done", result: rec };
  render(); window.scrollTo(0, 0);
}

function checkLimits() {
  S.broker.orders.filter(o => o.status === "Pendiente").forEach(o => {
    const p = px(o.sym);
    if (o.side === "buy" ? p <= o.limit : p >= o.limit) {
      const r = execute(o, p);
      Object.assign(o, r.ok ? { status: "Ejecutada", price: r.price, qty: r.qty, fee: r.fee, total: r.total, execDay: S.broker.day } : { status: "Rechazada", why: r.why });
    }
  });
}

function coach(dayPnl, pnl) {
  if (!Object.keys(S.broker.pos).length) return "";
  if (dayPnl < -equity() * 0.01) return `<div class="feedback no">Hoy bajó bastante. Así se siente la ${T("volatilidad")}. En la vida real, la clave es no vender por miedo.</div>`;
  if (pnl < 0) return `<div class="feedback no">Vas un poco abajo. Es normal: adelantá unos días y mirá qué pasa.</div>`;
  if (S.broker.day >= 40) return `<div class="feedback ok">Llevás ${S.broker.day} días en el simulador. ¿Ves cómo las bajas se mezclan con las subas?</div>`;
  return "";
}

/* ---------- Simulación del tiempo ---------- */

function advance(n) {
  const B = S.broker;
  for (let d = 0; d < n; d++) {
    INSTRUMENTS.forEach(i => {
      const m = S.market[i.sym];
      m.hist.push(m.px);
      if (m.hist.length > 260) m.hist.shift();
      m.px = m.px * (1 + i.mu + i.sigma * gauss());
    });
    B.day++;
    checkLimits();
    B.equity.push(equity());
  }
  save(); render();
}

function liveTick() {
  if (!S.market || !S.broker || document.hidden || modal) return;
  if (!["market", "detail", "order", "portfolio"].includes(view.name)) return;
  INSTRUMENTS.forEach(i => {
    if (i.type === "fci") return;
    S.market[i.sym].px *= 1 + i.sigma * 0.08 * gauss();
  });
  checkLimits();
  app.querySelectorAll("[data-px]").forEach(el => {
    const s = el.dataset.px, old = parseFloat(el.dataset.last || px(s));
    el.textContent = money(px(s));
    const row = el.closest(".tick") || el;
    row.classList.remove("flash-up", "flash-down"); void row.offsetWidth;
    row.classList.add(px(s) >= old ? "flash-up" : "flash-down");
    el.dataset.last = px(s);
  });
  app.querySelectorAll("[data-var]").forEach(el => {
    const v = dayVar(el.dataset.var);
    el.textContent = pct(v); el.className = `pill ${cls(v)} num`;
  });
  const t = app.querySelector("[data-total]");
  if (t) {
    const total = equity(), pnl = total - START_CASH;
    t.textContent = money(total);
    const pe = app.querySelector("[data-pnl]");
    pe.textContent = `${money(pnl)} (${pct(pnl / START_CASH)})`; pe.className = `${cls(pnl)} num`;
  }
  updateTicket();
  save();
}
setInterval(liveTick, 2500);

/* ---------- Glosario y diálogos ---------- */

function openTerm(t) {
  const g = GLOSSARY[t.toLowerCase()];
  if (!g) return;
  const title = { "fci": "Fondo común de inversión (FCI)", "ci": "CI (contado inmediato)", "cedear": "CEDEAR" }[t] || t[0].toUpperCase() + t.slice(1);
  modal = { html: `<h3>${title}</h3><p>${g[0]}</p><div class="example">Ejemplo: ${g[1]}</div><button class="btn ghost" data-act="close">Entendido</button>` };
  renderModal();
}
function ask(title, text, okLabel, onOk) {
  modal = { onOk, html: `<h3>${title}</h3><p class="muted">${text}</p><div class="stack">
    ${onOk ? `<button class="btn" data-act="modalOk">${okLabel}</button><button class="btn ghost" data-act="close">Cancelar</button>`
           : `<button class="btn" data-act="close">${okLabel}</button>`}</div>` };
  renderModal();
}
function renderModal() {
  sheet.innerHTML = modal ? `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${modal.html}</div></div>` : "";
}

/* =========================================================
   Eventos
   ========================================================= */

document.addEventListener("click", e => {
  const term = e.target.closest(".term");
  if (term) { e.stopPropagation(); return openTerm(term.dataset.term); }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, i = +el.dataset.i;
  switch (act) {
    case "close": if (e.target === el) { modal = null; renderModal(); } break;
    case "modalOk": { const f = modal.onOk; modal = null; renderModal(); f(); break; }
    case "start": go({ ...view, step: 0 }); break;
    case "onb":
      view.answers[ONBOARDING[view.step].key] = i;
      if (view.step < 2) go({ ...view, step: view.step + 1 });
      else { S.profile = view.answers; save(); go({ name: "path" }); }
      break;
    case "path": go({ name: "path" }); break;
    case "lesson": go({ name: "lesson", i }); break;
    case "quiz": go({ name: "quiz", i }); break;
    case "pick": view.picked = i; render(); break;
    case "retry": go({ name: "quiz", i: view.i }); break;
    case "finish":
      if (!S.done.includes(view.i)) S.done.push(view.i);
      if (view.i === 2) ensureBroker();
      save();
      go(view.i === 2 ? { name: "market" } : view.i === LEVELS.length - 1 ? { name: "leap" } : { name: "path" });
      break;
    case "leap": go({ name: "leap" }); break;
    case "lbo": ask("Próximamente", "Acá se abriría el alta en LBO con el monto sugerido. En este prototipo todavía no está conectado.", "Entendido"); break;
    case "reset":
      ask("¿Empezar de cero?", "Se borra tu progreso del camino y el simulador.", "Borrar todo", () => {
        S = fresh(); save(); go({ name: "welcome", step: -1, answers: {} });
      });
      break;
    case "demo": S.demo = true; ensureBroker(); save(); go({ name: "market" }); break;
    case "tab": {
      const t = el.dataset.tab;
      if (t !== "learn" && brokerOpen()) ensureBroker();
      go({ name: t === "learn" ? "path" : t });
      break;
    }
    case "tipOk": S.tips[el.dataset.id] = true; save(); render(); break;
    case "market": go({ name: "market", filter: view.filter }); break;
    case "filter": go({ name: "market", filter: el.dataset.f, q: view.q }); break;
    case "detail": go({ name: "detail", sym: el.dataset.sym }); break;
    case "range": view.range = el.dataset.r; render(); break;
    case "order": go(newOrder(el.dataset.sym, el.dataset.side)); break;
    case "side": view = newOrder(view.sym, el.dataset.side); render(); break;
    case "otype": view.type = el.dataset.t; if (view.type === "lim") view.limit = +px(view.sym).toFixed(2); render(); break;
    case "plazo": view.plazo = el.dataset.p; render(); break;
    case "step": {
      const fci = isFci(view.sym), d = +el.dataset.d;
      if (fci) view.amount = Math.max(0, Math.round(view.amount + d * 1000));
      else view.qty = Math.max(0, Math.round(view.qty) + d);
      app.querySelector("#q").value = fci ? view.amount : view.qty;
      updateTicket(); break;
    }
    case "review": if (!calc(view).err) go({ ...view, step: "review" }); break;
    case "editOrder": go({ ...view, step: "form" }); break;
    case "confirm": placeOrder(); break;
    case "cancel": {
      const o = S.broker.orders.find(x => x.id === +el.dataset.id);
      if (o && o.status === "Pendiente") { o.status = "Cancelada"; save(); render(); }
      break;
    }
    case "adv": advance(+el.dataset.n); break;
    case "resetBroker":
      ask("¿Reiniciar el simulador?", "Vuelve todo a $100.000 de mentira y se borran tus operaciones.", "Reiniciar", () => {
        S.broker = null; S.market = null; ensureBroker(); save(); go({ name: "portfolio" });
      });
      break;
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "search") {
    view.q = e.target.value;
    const q = view.q.trim().toLowerCase();
    app.querySelectorAll("[data-row]").forEach(r => r.hidden = q && !r.dataset.search.includes(q));
    return;
  }
  const f = e.target.dataset.field;
  if (f && view.name === "order") {
    const raw = e.target.value.trim();
    const v = parseFloat(raw.includes(",") ? raw.replace(/\./g, "").replace(",", ".") : raw);
    view[f] = isNaN(v) ? 0 : v;
    updateTicket();
  }
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && modal) { modal = null; renderModal(); } });

if (brokerOpen()) ensureBroker();
render();
</script>
</body>
</html>
