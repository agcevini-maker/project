<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin Miedo · prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Prototipo de escritorio (1440x900). Estructura en verde petróleo (barra lateral, hero),
     contenido sobre superficie clara para lectura cómoda, acento verde menta. */
  :root {
    --petrol-900: #0B2A33;
    --petrol-800: #003845;
    --petrol-700: #0E4A57;
    --petrol-600: #1B5F6B;
    --petrol-200: #9FC3C6;
    --mint: #2BB673;
    --mint-600: #1F9D63;
    --mint-100: #DDF4E8;
    --mint-50: #EEF9F3;
    --bg: #F2F6F5;
    --card: #FFFFFF;
    --ink: #0F2229;
    --ink-2: #4A5E64;
    --ink-3: #7A8C91;
    --line: #DCE5E4;
    --red: #D64545;   --red-100: #FBE4E4;
    --amber: #E3A21A; --amber-100: #FCF1D8;
    --green: #2BB673; --green-100: #DDF4E8;
    /* categóricos del simulador (validados para daltonismo) */
    --c-mm: #1F9D63; --c-bono: #2F6FB5; --c-cedear: #C76A12; --c-accion: #B0417A;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(11,42,51,.05), 0 8px 24px rgba(11,42,51,.06);
    --shadow-lg: 0 18px 50px rgba(11,42,51,.16);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.55 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid rgba(43,182,115,.45); outline-offset: 2px; border-radius: 8px; }
  h1, h2, h3, h4 { margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 800; }
  h2 { font-size: 22px; line-height: 1.25; font-weight: 800; }
  h3 { font-size: 17px; line-height: 1.3; font-weight: 700; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .small { font-size: 13.5px; }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  /* Botones y piezas */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--mint); color: #062018; transition: transform .15s, box-shadow .15s, background .15s; text-decoration: none; }
  .btn:hover { background: #33c47f; box-shadow: 0 6px 18px rgba(43,182,115,.3); transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.lg { padding: 15px 26px; font-size: 16px; border-radius: 14px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ghost:hover { border-color: var(--mint); box-shadow: none; background: var(--mint-50); }
  .btn.dark { background: var(--petrol-800); color: #fff; }
  .btn.dark:hover { background: var(--petrol-700); box-shadow: 0 6px 18px rgba(0,56,69,.3); }
  .btn.wa { background: #1FA855; color: #fff; }
  .btn.block { width: 100%; }
  .link { background: none; border: 0; padding: 0; color: var(--mint-600); font-weight: 700; }
  .link:hover { text-decoration: underline; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .card.hover { transition: transform .18s, box-shadow .18s, border-color .18s; }
  .card.hover:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: #c5d6d4; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--mint-100); color: #13774a; white-space: nowrap; }
  .pill.amber { background: var(--amber-100); color: #8a5a00; }
  .pill.red { background: var(--red-100); color: #a52a2a; }
  .pill.grey { background: #EAF0EF; color: var(--ink-2); }
  .pill.petrol { background: var(--petrol-800); color: #fff; }
  .sim-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: var(--amber-100); color: #7a5000; border: 1px solid #f1d58e; }
  .sim-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; }
  .bar { height: 10px; border-radius: 99px; background: #E3ECEA; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--mint); animation: grow .9s cubic-bezier(.2,.8,.2,1); transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .grid { display: grid; gap: 18px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .ic { width: 20px; height: 20px; flex: none; }
  .icon-box { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--mint-50); color: var(--mint-600); flex: none; }
  .icon-box .ic { width: 22px; height: 22px; }
  .note { font-size: 12px; color: var(--ink-3); }

  /* Términos con explicación */
  .term { border-bottom: 2px dotted var(--mint); cursor: help; font-weight: 600; }
  #tip { position: fixed; z-index: 90; max-width: 300px; background: var(--petrol-900); color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; box-shadow: var(--shadow-lg); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  #tip.on { opacity: 1; transform: none; }
  #tip b { color: #7EE2AE; display: block; margin-bottom: 2px; }
  #tip .ex { color: #C5DCDD; margin-top: 6px; display: block; }

  /* ---------- Landing ---------- */
  .landing { background: var(--bg); min-height: 100%; }
  .l-hero { background: radial-gradient(1200px 500px at 80% -10%, #0f4b58 0%, transparent 60%), linear-gradient(180deg, var(--petrol-900), var(--petrol-800)); color: #fff; }
  .l-wrap { max-width: 1240px; margin: 0 auto; padding-inline: 40px; }
  .l-nav { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  .l-nav .row { gap: 24px; }
  .l-nav .logo, .diag-top .logo { padding: 0; }
  .l-nav a, .l-nav .navlink { color: #CFE3E4; text-decoration: none; font-weight: 600; background: none; border: 0; }
  .l-nav .navlink:hover { color: #fff; }
  .l-hero-in { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; padding-block: 48px 84px; }
  .l-hero h1 { font-size: 56px; line-height: 1.04; letter-spacing: -.035em; }
  .l-hero h1 em { font-style: normal; color: var(--mint); }
  .l-hero .lead { font-size: 19px; color: #CFE3E4; margin: 20px 0 30px; max-width: 34ch; }
  .trust { display: flex; gap: 22px; margin-top: 30px; flex-wrap: wrap; color: #A9C7C9; font-size: 13.5px; font-weight: 600; }
  .trust span { display: inline-flex; gap: 8px; align-items: center; }
  .trust .ic { color: var(--mint); width: 18px; height: 18px; }
  .preview { position: relative; height: 430px; }
  .preview .card { position: absolute; color: var(--ink); }
  .l-section { padding-block: 72px; }
  .l-section h2 { font-size: 34px; }
  .frenos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 32px; }
  .freno { display: flex; flex-direction: column; gap: 14px; padding: 26px; }
  .freno .quote { font-size: 15px; color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 12px; font-style: italic; }
  .freno .solve { background: var(--mint-50); border-radius: 12px; padding: 14px; font-size: 14px; }
  .freno .solve b { color: #13774a; display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 32px; }
  .step-n { width: 34px; height: 34px; border-radius: 50%; background: var(--petrol-800); color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 14px; }
  .l-cta { background: var(--petrol-800); color: #fff; border-radius: 24px; padding: 44px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .l-foot { padding-block: 28px 40px; color: var(--ink-3); font-size: 12.5px; display: flex; justify-content: space-between; gap: 20px; }

  /* ---------- Diagnóstico ---------- */
  .diag { min-height: 100%; display: grid; grid-template-rows: auto 1fr; background: linear-gradient(180deg, var(--petrol-900) 0, var(--petrol-900) 220px, var(--bg) 220px); }
  .diag-top { color: #fff; }
  .diag-card { max-width: 760px; margin: 10px auto 40px; width: 100%; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .opt { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; transition: border-color .15s, background .15s, transform .15s; }
  .opt:hover { border-color: #a8d9bf; transform: translateY(-2px); }
  .opt.sel { border-color: var(--mint); background: var(--mint-50); }
  .opt .t { font-weight: 700; }
  .seg-progress { display: flex; gap: 6px; }
  .seg-progress span { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.2); }
  .seg-progress span.on { background: var(--mint); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .input { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; width: 100%; }
  .input:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(43,182,115,.15); }
  .money-in { position: relative; }
  .money-in span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 700; }
  .money-in .input { padding-left: 30px; font-weight: 700; font-size: 18px; }

  /* ---------- App shell ---------- */
  .shell { display: grid; grid-template-columns: 252px minmax(0, 1fr) 316px; height: 100vh; }
  .side { background: var(--petrol-900); color: #DCEBEC; display: flex; flex-direction: column; padding: 22px 16px; gap: 6px; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; color: #fff; }
  .logo b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; display: block; line-height: 1.1; }
  .logo small { color: var(--petrol-200); font-weight: 600; font-size: 12px; }
  .nav-i { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; background: none; border: 0; color: #BFD6D8; font-weight: 600; text-align: left; width: 100%; transition: background .15s, color .15s; }
  .nav-i:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-i.on { background: var(--petrol-700); color: #fff; box-shadow: inset 3px 0 0 var(--mint); }
  .nav-i.on .ic { color: var(--mint); }
  .nav-i .badge { margin-left: auto; font-size: 11px; background: var(--mint); color: #062018; border-radius: 99px; padding: 1px 7px; font-weight: 800; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); }
  .me { display: flex; gap: 10px; align-items: center; padding: 6px 8px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: var(--petrol-600); flex: none; }
  .main { overflow-y: auto; }
  .main-in { padding: 30px 36px 48px; max-width: 980px; margin: 0 auto; }
  .page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  .page-h p { margin-top: 6px; }
  .rail { background: #fff; border-left: 1px solid var(--line); overflow-y: auto; padding: 26px 22px; display: flex; flex-direction: column; gap: 22px; }
  .rail h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 12px; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; font-weight: 800; }
  .streak-days { display: flex; gap: 6px; margin-top: 12px; }
  .streak-days div { flex: 1; text-align: center; font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .streak-days i { display: block; height: 28px; border-radius: 8px; background: #EEF3F2; margin-bottom: 4px; }
  .streak-days .on i { background: linear-gradient(180deg, #FFB547, #F27B1A); }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: #fff; width: 100%; text-align: left; transition: border-color .15s, background .15s; }
  .todo:hover { border-color: var(--mint); background: var(--mint-50); }
  .todo .chk { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #c7d5d3; flex: none; display: grid; place-items: center; margin-top: 1px; }
  .todo.done { opacity: .6; }
  .todo.done .chk { background: var(--mint); border-color: var(--mint); color: #fff; }
  .todo.done .t { text-decoration: line-through; }

  /* Dashboard */
  .dash { grid-template-columns: repeat(6, 1fr); }
  .span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; }
  .goal-hero { background: linear-gradient(135deg, var(--petrol-800), var(--petrol-700)); color: #fff; border: 0; }
  .goal-hero .bar { background: rgba(255,255,255,.15); }
  .goal-hero .muted { color: #B9D3D5; }
  .big-num { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }

  /* Aprender: camino */
  .path { position: relative; display: flex; flex-direction: column; gap: 22px; padding: 10px 0 20px; }
  .lvl { display: flex; align-items: center; gap: 20px; }
  .lvl:nth-child(4n+2) { padding-left: 120px; } .lvl:nth-child(4n+3) { padding-left: 200px; } .lvl:nth-child(4n+4) { padding-left: 120px; }
  .node { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; position: relative; box-shadow: 0 6px 0 rgba(0,0,0,.12); transition: transform .15s; }
  .node:hover { transform: translateY(-2px); }
  .node .ic { width: 30px; height: 30px; }
  .node.done { background: var(--mint); color: #fff; box-shadow: 0 6px 0 #1b8a55; }
  .node.cur { background: #fff; color: var(--petrol-800); border: 4px solid var(--mint); box-shadow: 0 6px 0 #1b8a55, 0 0 0 0 rgba(43,182,115,.5); animation: pulse 2s infinite; }
  .node.lock { background: #E3EAE9; color: #93A5A8; box-shadow: 0 6px 0 #cdd8d6; cursor: not-allowed; }
  @keyframes pulse { 0% { box-shadow: 0 6px 0 #1b8a55, 0 0 0 0 rgba(43,182,115,.5); } 70% { box-shadow: 0 6px 0 #1b8a55, 0 0 0 16px rgba(43,182,115,0); } 100% { box-shadow: 0 6px 0 #1b8a55, 0 0 0 0 rgba(43,182,115,0); } }
  @media (prefers-reduced-motion: reduce) { .node.cur { animation: none; } .bar > span { animation: none; } }
  .lvl-info { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; min-width: 300px; box-shadow: var(--shadow); }
  .lvl.lockrow .lvl-info { background: #F6F9F8; box-shadow: none; }

  /* Lección */
  .lesson-top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .lp { display: flex; gap: 6px; flex: 1; }
  .lp span { flex: 1; height: 8px; border-radius: 99px; background: #E3ECEA; transition: background .3s; }
  .lp span.on { background: var(--mint); }
  .lcard { padding: 40px 44px; min-height: 340px; display: flex; flex-direction: column; gap: 18px; }
  .lcard h2 { font-size: 28px; }
  .lcard p { font-size: 18px; line-height: 1.65; color: #23383E; }
  .lcard .kicker { display: flex; gap: 14px; align-items: center; }
  .callout { background: var(--mint-50); border-radius: 14px; padding: 16px 18px; font-size: 16px; }
  .callout.red { background: var(--red-100); }
  .q-opt { width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px; font-weight: 600; display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s; }
  .q-opt:hover:not(:disabled) { border-color: #a8d9bf; }
  .q-opt .k { width: 30px; height: 30px; border-radius: 8px; background: #EEF3F2; display: grid; place-items: center; font-weight: 800; flex: none; }
  .q-opt.right { border-color: var(--mint); background: var(--mint-50); }
  .q-opt.right .k { background: var(--mint); color: #fff; }
  .q-opt.wrong { border-color: var(--red); background: var(--red-100); }
  .q-opt.wrong .k { background: var(--red); color: #fff; }
  .q-opt:disabled { cursor: default; }
  .fb { border-radius: 14px; padding: 16px 18px; display: flex; gap: 12px; animation: pop .25s ease-out; }
  .fb.ok { background: var(--mint-100); } .fb.no { background: var(--red-100); }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Detector */
  .light { width: 132px; padding: 16px; background: #13252B; border-radius: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; flex: none; }
  .light i { width: 70px; height: 70px; border-radius: 50%; background: #2a3b41; transition: background .3s, box-shadow .3s; }
  .light i.r.on { background: #F05252; box-shadow: 0 0 30px rgba(240,82,82,.7); }
  .light i.y.on { background: #F7C33B; box-shadow: 0 0 30px rgba(247,195,59,.7); }
  .light i.g.on { background: #35CE85; box-shadow: 0 0 30px rgba(53,206,133,.7); }
  .chk-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .chk-row:first-child { border-top: 0; }
  .tri { display: flex; background: #EEF3F2; border-radius: 10px; padding: 3px; gap: 3px; }
  .tri button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .tri button.on.si { background: var(--red); color: #fff; }
  .tri button.on.no { background: var(--mint); color: #062018; }
  .tri button.on.ns { background: var(--amber); color: #3b2a00; }
  .tri.inv button.on.si { background: var(--mint); color: #062018; }
  .tri.inv button.on.no { background: var(--red); color: #fff; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; text-align: left; transition: border-color .15s, background .15s; }
  .chip:hover { border-color: var(--mint); background: var(--mint-50); }
  .placeholder { background: repeating-linear-gradient(45deg, #F6F9F8, #F6F9F8 8px, #EFF4F3 8px, #EFF4F3 16px); border: 1.5px dashed #c5d6d4; border-radius: 12px; padding: 4px 10px; font-weight: 700; color: var(--ink-2); font-size: 13px; }

  /* Simulador */
  .opt4 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .inv { position: relative; overflow: hidden; }
  .inv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
  .inv .icon-box { background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); }
  .risk { display: inline-flex; gap: 3px; align-items: center; }
  .risk i { width: 14px; height: 6px; border-radius: 3px; background: #DCE5E4; }
  .risk i.on { background: var(--c, var(--ink)); }
  input[type=range] { width: 100%; accent-color: var(--c, var(--mint)); }
  .alloc { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; background: #E3ECEA; }
  .alloc div { transition: width .3s; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend i.line { height: 3px; border-radius: 2px; width: 18px; }
  .legend i.dash { height: 0; border-top: 3px dashed; background: none !important; width: 18px; border-radius: 0; }

  /* Gráficos */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }

const money = n => "$" + Math.round(n).toLocaleString("es-AR");
const pct = n => (n >= 0 ? "+" : "−") + Math.abs(n * 100).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Aleatorio con semilla: el mismo resultado cada vez que se abre el prototipo.
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = Math.imul(s ^ s >>> 15, 1 | s); x ^= x + Math.imul(x ^ x >>> 7, 61 | x); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function ringSvg(frac, size = 84) {
  const r = size / 2 - 7, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#E3ECEA" stroke-width="8"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#2BB673" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .8s"/></svg>`;
}

/* ---------- 6. Lección ---------- */
function lesson() {
  const i = V.lvl ?? current(), l = LEVELS[i], step = V.step || 0, total = l.cards.length + 1;
  const isQ = step >= l.cards.length;
  const head = `<div class="lesson-top"><button class="btn ghost" data-go="learn">${icon("back")}Camino</button>
    <div class="lp">${Array.from({ length: total }, (_, k) => `<span class="${k <= step ? "on" : ""}"></span>`).join("")}</div>
    <span class="pill">Nivel ${i + 1} de 6</span></div>`;
  if (!isQ) {
    const c = l.cards[step];
    return `${head}<div class="card lcard">
      <div class="kicker"><div class="icon-box">${icon(i === 2 ? "shield" : "learn")}</div><span class="eyebrow">${esc(l.title)} · Tarjeta ${step + 1} de ${l.cards.length}</span></div>
      <h2>${c.h}</h2><p>${c.p}</p>
      ${c.callout ? `<div class="callout ${c.red ? "red" : ""}">${c.callout}</div>` : ""}
      <p class="small faint" style="margin-top:auto">Pasá el mouse por las palabras subrayadas para ver qué significan.</p>
    </div>
    <div class="between" style="margin-top:18px">
      ${step > 0 ? `<button class="btn ghost" data-act="lstep" data-d="-1">${icon("back")}Anterior</button>` : "<span></span>"}
      <button class="btn lg" data-act="lstep" data-d="1">${step === l.cards.length - 1 ? "Ir a la pregunta" : "Siguiente"} ${icon("arrow")}</button>
    </div>`;
  }
  const picked = V.picked, ans = picked != null, ok = picked === l.a;
  return `${head}<div class="card lcard">
    <div class="kicker"><div class="icon-box">${icon("star")}</div><span class="eyebrow">Pregunta de práctica</span></div>
    <h2>${l.q}</h2>
    <div class="stack">${l.opts.map((o, k) => `<button class="q-opt ${ans ? (k === l.a ? "right" : k === picked ? "wrong" : "") : ""}" data-pick="${k}" ${ans ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span>${o}</button>`).join("")}</div>
    ${ans ? `<div class="fb ${ok ? "ok" : "no"}"><span>${icon(ok ? "check" : "alert")}</span><div><b>${ok ? "¡Exacto!" : "Casi. Mirá por qué:"}</b><p class="small" style="margin-top:4px">${l.why}</p></div></div>` : ""}
  </div>
  <div class="between" style="margin-top:18px">
    <button class="btn ghost" data-act="lstep" data-d="-1">${icon("back")}Volver a las tarjetas</button>
    ${ans ? (ok ? `<button class="btn lg" data-act="finishLvl">${S.done.includes(i) ? "Listo" : "Completar nivel"} ${icon("check")}</button>` : `<button class="btn lg" data-act="retryQ">Intentar de nuevo</button>`) : `<span class="small faint">Elegí una opción</span>`}
  </div>`;
}

/* ---------- 7. ¿Es estafa? ---------- */
const SIGNALS = [
  { id: "garantia", q: "¿Promete ganancias garantizadas o muy altas?", why: "Ninguna inversión real puede garantizar ganancias. Rendimientos de 10% o más por mes son una señal fuerte de estafa.", re: /garantiz|asegurad|sin riesgo|segur[oa]|duplic|tripl|x2|x3|\b([1-9]\d|\d{3,})\s?%\s?(mensual|por mes|semanal|por semana|diario|por d[ií]a)/i },
  { id: "apuro", q: "¿Te apura para decidir?", why: "Las estafas no te dejan pensar: “solo por hoy”, “quedan pocos lugares”.", re: /hoy|ya mismo|urgente|[uú]ltim|solo por|quedan pocos|r[aá]pido|ahora/i },
  { id: "referidos", q: "¿Te pide traer a otros para ganar más?", why: "Si ganás por sumar gente, es probable que sea un esquema Ponzi o piramidal.", re: /tra[eé]|invit|referid|sum[aá]s? (gente|personas|amigos)|por cada (persona|amigo)|red de|niveles/i },
  { id: "cnv", q: "¿Está registrada ante la CNV?", why: "Buscala en el registro de la CNV. Si no aparece, no debería ofrecerte inversiones.", inverse: true },
  { id: "redes", q: "¿Te contactó por redes o WhatsApp sin que lo pidas?", why: "Las ofertas que llegan solas por Instagram, TikTok, Telegram o WhatsApp son el canal favorito de las estafas.", re: /instagram|insta\b|whats|wpp|telegram|tiktok|facebook|\bdm\b|mensaje privado|me escribi/i }
];
const SCAM_EXAMPLES = [
  "Me ofrecen 30% mensual garantizado por Instagram",
  "Un grupo de Telegram me invita a ganar por cada amigo que sume, pero tengo que entrar hoy",
  "Quiero abrir una cuenta en una ALyC registrada en la CNV para comprar un fondo de liquidez"
];
function analyze(text) {
  const ans = {};
  SIGNALS.forEach(s => { ans[s.id] = s.inverse ? (/registrad[ao].{0,20}cnv|cnv.{0,20}registrad|\balyc\b/i.test(text) ? "si" : "ns") : (s.re.test(text) ? "si" : "no"); });
  return ans;
}
function verdict(ans) {
  const red = ["garantia", "referidos"].some(k => ans[k] === "si") || ans.cnv === "no";
  const flags = ["garantia", "apuro", "referidos", "redes"].filter(k => ans[k] === "si").length;
  if (red || flags >= 2) return { c: "r", t: "Alto riesgo de estafa", d: "Tiene señales típicas de estafa. No pongas plata y no compartas tus datos.", pill: "red" };
  if (flags === 1 || ans.cnv !== "si" || Object.values(ans).includes("ns")) return { c: "y", t: "Ojo: faltan datos", d: "No es seguro que sea una estafa, pero hay cosas para chequear antes de poner un peso.", pill: "amber" };
  return { c: "g", t: "No vemos señales de alerta", d: "Igual, invertí solo con empresas registradas en la CNV y nunca compartas tus claves.", pill: "" };
}
function scam() {

      <div class="row" style="margin-top:16px"><button class="btn" data-act="analyze">${icon("shield")}Analizar oferta</button><span class="xs faint">Es una guía para aprender, no un análisis legal.</span></div>
    </div>
    ${r ? (() => {
      const v = verdict(r.ans);
      return `<div class="grid" style="grid-template-columns:auto 1fr;margin-top:18px;align-items:start">
        <div class="light" aria-label="Semáforo: ${v.t}"><i class="r ${v.c === "r" ? "on" : ""}"></i><i class="y ${v.c === "y" ? "on" : ""}"></i><i class="g ${v.c === "g" ? "on" : ""}"></i></div>
        <div class="card">
          <span class="pill ${v.pill}">${v.c === "r" ? "Rojo" : v.c === "y" ? "Amarillo" : "Verde"}</span>
          <h2 style="margin-top:10px">${v.t}</h2><p class="muted" style="margin-top:4px">${v.d}</p>
          <div style="margin-top:16px">${SIGNALS.map(s => {
            const a = r.ans[s.id];
            return `<div class="chk-row"><div><b>${s.q.replace("CNV", t("cnv", "CNV"))}</b><p class="small muted" style="margin-top:2px">${s.why}</p></div>

          }).join("")}</div>

        </div></div>`;
    })() : ""}
    <div class="card" style="margin-top:18px">
      <div class="row" style="gap:14px"><div class="icon-box" style="background:var(--petrol-800);color:var(--mint)">${icon("shield")}</div><div><span class="eyebrow">Por qué LBO es confiable</span><h3 style="margin-top:2px">Chequeá lo mismo que le pedimos a cualquiera</h3></div></div>

/* ---------- 8. Simulador ---------- */
function simSeries() {
  const a = S.sim.alloc, r = rng(20251010), months = 12;
  const vals = { mm: [a.mm], bono: [a.bono], cedear: [a.cedear], accion: [a.accion] };
  for (let m = 1; m <= months; m++) OPTIONS.forEach(o => { const v = vals[o.id]; v.push(v[m - 1] * (1 + o.mu + o.sd * gauss(r))); });
  const cash = 100000 - Object.values(a).reduce((x, y) => x + y, 0);
  const total = Array.from({ length: months + 1 }, (_, m) => cash + OPTIONS.reduce((s, o) => s + vals[o.id][m], 0));
  return { vals, total, cash };
}
function sim() {
  const a = S.sim.alloc, used = Object.values(a).reduce((x, y) => x + y, 0), m = S.sim.month;
  const { vals, total, cash } = simSeries();
  const now = total[m], diff = now - 100000;
  const types = OPTIONS.filter(o => a[o.id] > 0).length;
  return `
    <div class="page-h"><div><span class="eyebrow">Simulador</span><h1 style="margin-top:6px">Tu cartera de práctica</h1><p class="muted">Repartí $100.000 virtuales entre 4 opciones y mirá qué podría pasar mes a mes.</p></div>
      <span class="sim-tag"><i></i>Modo práctica · plata virtual</span></div>
    <div class="grid" style="grid-template-columns:2fr 1fr;align-items:stretch">
      <div class="card">
        <div class="between"><div><span class="eyebrow">Valor de tu cartera</span><div class="big-num num" style="margin-top:4px">${money(now)}</div>
          <span class="pill ${diff >= 0 ? "" : "red"} num">${pct(diff / 100000)} desde el inicio</span> <span class="pill grey">Mes ${m} de 12 · simulado</span></div>
          <div class="row" style="flex:none"><button class="btn ghost" style="white-space:nowrap" data-act="simReset" ${m === 0 ? "disabled" : ""}>Reiniciar</button><button class="btn" style="white-space:nowrap" data-act="simStep" ${m >= 12 || used > 100000 ? "disabled" : ""}>Avanzar 1 mes ${icon("arrow")}</button></div></div>
        <div style="margin-top:18px" id="chart-sim"></div>
        <p class="note" style="margin-top:8px">Evolución simulada con datos ilustrativos. No son precios reales. Rendimientos pasados no garantizan resultados futuros.</p>
      </div>
      <div class="card">
        <span class="eyebrow">Cómo repartiste</span>
        <div class="alloc" style="margin:14px 0">${OPTIONS.map(o => `<div style="width:${a[o.id] / 1000}%;background:${o.color}" title="${o.name}"></div>`).join("")}<div style="width:${Math.max(0, cash) / 1000}%;background:#CFDAD8"></div></div>
        <div class="stack" style="gap:8px">${OPTIONS.map(o => `<div class="between small"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${o.color};display:inline-block"></i>${o.name}</span><b class="num">${money(vals[o.id][m])}</b></div>`).join("")}
          <div class="between small"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:#CFDAD8;display:inline-block"></i>Sin invertir</span><b class="num">${money(Math.max(0, cash))}</b></div></div>
        <div class="callout" style="margin-top:16px;font-size:14px">${types >= 3 ? `Repartiste en ${types} opciones: eso es ${t("diversificar", "diversificar")}, y suma puntos en la liga.` : `Probá repartir en 3 o más opciones: ${t("diversificar", "diversificar")} baja el riesgo y suma puntos en la liga.`}</div>
        ${used > 100000 ? `<div class="callout red" style="margin-top:10px;font-size:14px">Te pasaste por ${money(used - 100000)}. Bajá alguna opción.</div>` : ""}
      </div>
    </div>
    <h2 style="margin:28px 0 14px">Las 4 opciones, en palabras simples</h2>
    <div class="opt4">${OPTIONS.map(o => `
      <div class="card hover inv" style="--c:${o.color}">
        <div class="between"><div class="row" style="gap:12px"><div class="icon-box">${icon(o.icon)}</div><div><h3>${t(o.term, o.name)}</h3><span class="xs faint">${o.sub}</span></div></div>
          <div style="text-align:right"><div class="risk" aria-label="${o.riskLabel}">${[1, 2, 3, 4].map(k => `<i class="${k <= o.risk ? "on" : ""}"></i>`).join("")}</div><div class="xs" style="font-weight:700;margin-top:4px">${o.riskLabel}</div></div></div>
        <p class="muted" style="margin:12px 0 14px">${o.desc}</p>
        <div class="between small"><label for="r-${o.id}"><b>Cuánto ponés</b></label><b class="num">${money(a[o.id])}</b></div>
        <input type="range" id="r-${o.id}" min="0" max="100000" step="5000" value="${a[o.id]}" data-alloc="${o.id}" ${m > 0 ? "disabled" : ""}>
      </div>`).join("")}</div>
    ${m > 0 ? `<p class="small muted" style="margin-top:10px">Para cambiar cómo repartiste, tocá “Reiniciar”.</p>` : ""}`;
}

/* ---------- 9. Liga ---------- */
function myScore() {
  const types = OPTIONS.filter(o => S.sim.alloc[o.id] > 0).length;
  const parts = { div: types * 100, days: S.streak * 30, lessons: S.done.length * 80, scams: S.scams * 60 };
  return { types, pts: 300 + parts.div + parts.days + parts.lessons + parts.scams };
}
function leagueRows(kind) {
  const ms = myScore();
  const me = { name: myName() + " (vos)", me: true, pts: ms.pts, div: ms.types, days: S.streak, lessons: S.done.length, scams: S.scams };
  let rows = kind === "curso" ? COURSE.map((n, k) => {
    const f = FRIENDS.find(x => x.name === n); if (f) return { ...f };
    const r = rng(k + 7); return { name: n, pts: Math.round(300 + r() * 900), div: 1 + Math.floor(r() * 4), days: 1 + Math.floor(r() * 12), lessons: 1 + Math.floor(r() * 5), scams: Math.floor(r() * 3) };
  }) : FRIENDS.map(f => ({ ...f }));
  rows.push(me); rows.sort((x, y) => y.pts - x.pts);
  return rows;
}
function league() {
  const kind = S.league, rows = leagueRows(kind);
  return `
    <div class="page-h"><div><span class="eyebrow">Liga</span><h1 style="margin-top:6px">Liga con amigos</h1><p class="muted">Gana quien mejor administra, no quien más arriesga.</p></div>

        <div class="between" style="padding:18px 20px"><div class="tabs"><button class="${kind === "amigos" ? "on" : ""}" data-league="amigos">Mis amigos</button><button class="${kind === "curso" ? "on" : ""}" data-league="curso">Liga de mi curso · 5° B</button></div><span class="xs faint">Temporada de octubre</span></div>
        <table><thead><tr><th style="padding-left:20px">#</th><th>Jugador</th><th class="c">Diversificación</th><th class="c">Racha</th><th class="c">Niveles</th><th class="c">Estafas</th><th style="text-align:right;padding-right:20px">Puntos</th></tr></thead>
          <tbody>${rows.map((r, k) => `<tr class="${r.me ? "me-row" : ""}">
            <td style="padding-left:20px"><span class="rank ${k < 3 ? "r" + (k + 1) : ""}">${k + 1}</span></td>
            <td><div class="row" style="gap:10px"><div class="avatar" style="width:32px;height:32px;background:${r.me ? "var(--mint)" : "var(--petrol-600)"};color:${r.me ? "#062018" : "#fff"}">${esc(r.name[0])}</div><b style="white-space:nowrap">${esc(r.name)}</b></div></td>
            <td class="c num">${r.div} de 4</td><td class="c num" style="white-space:nowrap">${r.days} ${r.days === 1 ? "día" : "días"}</td><td class="c num">${r.lessons} de 6</td><td class="c num">${r.scams}</td>
            <td style="text-align:right;padding-right:20px"><b class="num">${r.pts.toLocaleString("es-AR")}</b></td></tr>`).join("")}</tbody></table>
        <p class="xs faint" style="padding:12px 20px;border-top:1px solid var(--line)">Nombres ficticios de ejemplo.</p>
      </div>
      <div class="stack">
        <div class="card">
          <span class="eyebrow">Cómo se suman puntos</span>
          <div class="grid" style="margin-top:12px;gap:14px;grid-template-columns:repeat(4,1fr)">${[
            ["sim", "Diversificar", "100 por cada tipo de opción en tu cartera"],

          ].map(([ic, h, d]) => `<div class="row" style="align-items:flex-start"><div class="icon-box" style="width:36px;height:36px">${icon(ic)}</div><div><b>${h}</b><p class="small muted">${d}</p></div></div>`).join("")}</div>

function wiData(amt) {
  const r = rng(7), caj = [], inv = []; let v = amt;

function smallData(monthly, target) {
  const aport = [0], inv = [0]; let tA = null, tI = null;
  for (let m = 1; m <= 36; m++) {
    aport.push(aport[m - 1] + monthly); inv.push(inv[m - 1] * (1 + INV_M) + monthly);
    if (!tA && aport[m] >= target) tA = m; if (!tI && inv[m] >= target) tI = m;
  }
  return { aport, inv, tA, tI };
}

/* =================================================================
   Gráficos (SVG con tooltip al pasar el mouse)
   ================================================================= */
const CHARTS = {};
function lineChart(id, { labels, series, fmt = money, height = 280, yLabel = "" }) {
  const el = document.getElementById(id); if (!el) return;
  const W = el.clientWidth || 600, H = height, L = 64, R = 18, T = 14, B = 30;
  const all = series.flatMap(s => s.values);
  let min = Math.min(...all), max = Math.max(...all);
  const pad = (max - min) * 0.12 || max * 0.1 || 1; min = Math.max(0, min - pad); max += pad;
  const n = labels.length - 1;
  const x = i => L + (W - L - R) * (n ? i / n : 0), y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const ticks = 4, grid = Array.from({ length: ticks + 1 }, (_, k) => min + (max - min) * k / ticks);
  const xEvery = Math.ceil(labels.length / 7);
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${series.map(s => s.name).join(" y ")}">
    ${grid.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EEEC"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#7A8C91">${fmt(v)}</text>`).join("")}
    ${labels.map((l, i) => i % xEvery === 0 || i === n ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#7A8C91">${l}</text>` : "").join("")}
    ${series.map(s => s.area ? `<path d="M${x(0)},${y(min)} ${s.values.map((v, i) => `L${x(i)},${y(v)}`).join(" ")} L${x(s.values.length - 1)},${y(min)}Z" fill="${s.color}" fill-opacity=".10"/>` : "").join("")}
    ${series.map(s => `<polyline points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5"' : ""}/>`).join("")}
    ${series.map(s => { const i = s.values.length - 1; return `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; }).join("")}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#9DB3B6" stroke-dasharray="3 3" opacity="0"/>
    ${series.map((s, k) => `<circle class="hp" data-k="${k}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2" opacity="0"/>`).join("")}
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/>
  </svg><div class="hover-tip"></div></div>
  <div class="legend" style="margin-top:8px">${series.map(s => `<span><i class="${s.dash ? "dash" : "line"}" style="background:${s.color};border-color:${s.color}"></i>${s.name}</span>`).join("")}</div>`;
  CHARTS[id] = { labels, series, fmt, x, y, L, W, R, n };
}
document.addEventListener("mousemove", e => {
  const hit = e.target.closest?.(".hit");
  document.querySelectorAll(".chart").forEach(c => {
    if (hit && c.contains(hit)) return;
    c.querySelector(".hover-tip")?.classList.remove("on"); c.querySelector(".xh")?.setAttribute("opacity", 0); c.querySelectorAll(".hp").forEach(p => p.setAttribute("opacity", 0));
  });
  if (!hit) return;
  const wrap = hit.closest(".chart"), id = wrap.parentElement.id, C = CHARTS[id]; if (!C) return;
  const svg = wrap.querySelector("svg"), box = svg.getBoundingClientRect(), scale = C.W / box.width;
  const px = (e.clientX - box.left) * scale;
  const i = Math.max(0, Math.min(C.n, Math.round((px - C.L) / (C.W - C.L - C.R) * C.n)));
  const xx = C.x(i);
  wrap.querySelector(".xh").setAttribute("x1", xx); wrap.querySelector(".xh").setAttribute("x2", xx); wrap.querySelector(".xh").setAttribute("opacity", 1);
  wrap.querySelectorAll(".hp").forEach(p => { const s = C.series[+p.dataset.k]; if (s.values[i] == null) return p.setAttribute("opacity", 0); p.setAttribute("cx", xx); p.setAttribute("cy", C.y(s.values[i])); p.setAttribute("opacity", 1); });
  const tip = wrap.querySelector(".hover-tip");
  tip.innerHTML = `<b>${C.labels[i]}</b><br>${C.series.filter(s => s.values[i] != null).map(s => `<i style="background:${s.color}"></i>${s.name}: <b>${C.fmt(s.values[i])}</b>`).join("<br>")}`;
  const top = Math.min(...C.series.filter(s => s.values[i] != null).map(s => C.y(s.values[i])));
  tip.style.left = (xx / scale) + "px"; tip.style.top = (top / scale) + "px"; tip.classList.add("on");
});

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#2BB673", "#7EE2AE", "#F7C33B", "#2F6FB5", "#ffffff", "#B0417A"];
  const P = Array.from({ length: 160 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* =================================================================
   Eventos
   ================================================================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-act],[data-diag],[data-lvl],[data-pick],[data-example],[data-sig],[data-league],[data-ask],[data-wi],[data-nsal],[data-scroll],[data-jump]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.scroll) { document.getElementById(d.scroll)?.scrollIntoView({ behavior: "smooth" }); return; }
  if (d.jump) { modal(""); jump(d.jump); return; }
  if (d.go) {
    if (d.go === "lesson") return go("lesson", { lvl: current(), step: 0 });
    if (d.go === "diag") return go("diag", { step: 0 });
    return go(d.go);
  }
  if (d.diag) { S[DIAG[V.step || 0].key] = d.diag; save(); render(); return; }
  if (d.lvl != null) {
    const i = +d.lvl;
    if (S.done.includes(i) || i === current()) return go("lesson", { lvl: i, step: 0 });
    toast("Completá el nivel anterior para desbloquear este."); return;
  }
  if (d.pick != null) { V.picked = +d.pick; render(); return; }
  if (d.example) { V.scamText = d.example; V.scam = { ans: analyze(d.example) }; S.scams++; save(); render(); return; }
  if (d.sig) { V.scam.ans[d.sig] = d.v; render(); return; }
  if (d.league) { S.league = d.league; save(); render(); return; }
  if (d.ask) { sendAsk(d.ask); return; }
  if (d.wi) { V.wiAmt = +d.wi; render(); return; }
  if (d.nsal) { V.nSal = +d.nsal; render(); return; }
  switch (d.act) {
    case "diagBack": V.step--; render(); break;
    case "diagNext":
      if ((V.step || 0) < DIAG.length - 1) { V.step = (V.step || 0) + 1; render(); }
      else { S.started = true; save(); root.innerHTML = `<div class="diag" style="place-items:center;display:grid;background:var(--petrol-900);color:#fff;text-align:center"><div><div class="medal" style="animation:pop .4s">${icon("sparkle")}</div><h1>Armando tu camino…</h1><p style="color:#A9C7C9;margin-top:8px">Lo personalizamos según tus respuestas.</p></div></div>`; setTimeout(() => go("home"), 1100); }
      break;
    case "lstep": V.step = Math.max(0, (V.step || 0) + +d.d); V.picked = null; render(); break;
    case "retryQ": V.picked = null; render(); break;
    case "finishLvl": finishLevel(); break;
    case "analyze": {
      const txt = document.getElementById("scam-in").value.trim();
      if (!txt) { toast("Escribí o pegá la oferta que te llegó."); return; }
      V.scamText = txt; V.scam = { ans: analyze(txt) }; S.scams++; save(); render(); break;
    }
    case "simStep": S.simTouched = true; S.sim.month = Math.min(12, S.sim.month + 1); save(); render(); break;
    case "simReset": S.sim.month = 0; save(); render(); break;
    case "invite": {
      const link = "sinmiedo.lbo.com.ar/liga/" + myName().toLowerCase().replace(/\W+/g, "") + "-5b";
      const msg = `Sumate a mi liga en Sin Miedo: practicamos inversiones con plata virtual y gana quien mejor administra. ${link}`;
      modal(`<h2>Invitá a tus amigos</h2><p class="muted" style="margin:6px 0 16px">Cada amigo que se suma juega con su propia plata virtual.</p>
        <div class="field"><label>Tu link de invitación</label><div class="row"><input class="input" value="${link}" readonly id="inv-link"><button class="btn ghost" data-act="copyInvite">Copiar</button></div><span class="xs faint">Link de ejemplo del prototipo.</span></div>
        <a class="btn wa block" style="margin-top:14px" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" data-act="invited">${icon("wa")}Compartir por WhatsApp</a>
        <button class="btn ghost block" style="margin-top:10px" data-act="closeModal">Cerrar</button>`);
      break;
    }
    case "copyInvite": { const i = document.getElementById("inv-link"); try { navigator.clipboard.writeText(i.value).then(() => toast("Link copiado"), () => { i.select(); }); } catch (err) { i.select(); } S.invited = true; save(); break; }
    case "invited": S.invited = true; save(); break;
    case "closeModal": if (e.target === el || el.tagName === "BUTTON") modal(""); break;
    case "openAccount": modal(`<div class="medal" style="width:72px;height:72px">${icon("rocket")}</div><h2 style="text-align:center">Acá empieza tu cuenta en LBO</h2><p class="muted" style="text-align:center;margin:8px 0 18px">En el producto real, este botón lleva al alta de cuenta en LBO con tu meta y el monto que elegiste. En el prototipo termina acá.</p><button class="btn block" data-act="closeModal">Entendido</button>`); break;
    case "minor": S.minor = el.checked; save(); render(); break;
    case "map": showMap(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch (err) {} S = fresh(); modal(""); go("landing"); break;
  }
});

function finishLevel() {
  const i = V.lvl;
  const first = !S.done.includes(i);
  if (first) { S.done.push(i); S.done.sort((a, b) => a - b); }
  save(); confetti();
  if (allDone() && first) { setTimeout(() => go("leap"), 700); return; }
  modal(`<div class="medal" style="width:76px;height:76px">${icon("star")}</div><h2 style="text-align:center">¡Nivel ${i + 1} completo!</h2>
    <p class="muted" style="text-align:center;margin:8px 0 18px">${first ? "+80 puntos en la liga." : "Buen repaso."} ${allDone() ? "" : `Se desbloqueó el nivel ${current() + 1}: ${LEVELS[current()].title}.`}</p>
    <div class="row"><button class="btn ghost" style="flex:1" data-go="learn" data-act="closeModal">Ver el camino</button>${allDone() ? `<button class="btn" style="flex:1" data-go="leap">Dar el salto</button>` : `<button class="btn" style="flex:1" data-go="lesson">Siguiente nivel</button>`}</div>`);
}
document.getElementById("modal").addEventListener("click", e => { if (e.target.closest("[data-go]")) modal(""); });

function sendAsk(q) {
  q = q.trim(); if (!q) return;
  S.chat.push({ me: true, h: q }); V.typing = true; render(); scrollChat();
  setTimeout(() => { V.typing = false; S.chat.push({ me: false, h: answerFor(q) }); save(); render(); scrollChat(); }, 800);
}
function scrollChat() { const l = document.getElementById("chat-log"); if (l) l.scrollTop = l.scrollHeight; }

document.addEventListener("submit", e => { if (e.target.id === "ask-form") { e.preventDefault(); const i = document.getElementById("ask-in"); sendAsk(i.value); } });

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) { S[el.dataset.bind] = el.value; save(); return; }
  if (el.dataset.alloc) {
    S.sim.alloc[el.dataset.alloc] = +el.value; S.simTouched = true; save();
    const id = el.id; render(); document.getElementById(id)?.focus(); return;
  }
  if (el.dataset.num) {
    const v = parseInt(el.value.replace(/\D/g, ""), 10) || 0;
    V[el.dataset.num] = Math.min(v, 99999999);
    clearTimeout(window._nt); window._nt = setTimeout(() => {
      const id = el.id; render(); const n = document.getElementById(id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 450);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { modal(""); hideTip(); }
  if ((e.key === "m" || e.key === "M") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) showMap();
});
window.addEventListener("resize", () => mountCharts());

/* ---------- Mapa del prototipo (para presentar) ---------- */
const SCREENS = [
  ["landing", "Landing"], ["diag", "Diagnóstico"], ["home", "Inicio"], ["whatif", "¿Y si…?"], ["learn", "Aprender"], ["lesson3", "Lección nivel 3"],
  ["scam", "¿Es estafa?"], ["sim", "Simulador"], ["league", "Liga con amigos"], ["ask", "Preguntá sin vergüenza"], ["small", "Empezar con poco"], ["leap", "El salto"]
];
function showMap() {
  modal(`<h2>Mapa del prototipo</h2><p class="muted small" style="margin-top:4px">Saltá a cualquier pantalla. Atajo: tecla M.</p>
    <div class="map-grid">${SCREENS.map(([id, l], k) => `<button data-jump="${id}"><b>${k + 1}</b>${l}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" style="flex:1" data-act="reset">Reiniciar el prototipo</button><button class="btn" style="flex:1" data-act="closeModal">Cerrar</button></div>`);
}
function jump(id) {
  if (!S.started && !["landing", "diag"].includes(id)) { S.started = true; S.freno = S.freno || "miedo"; S.goal = S.goal || "viaje"; S.exp = S.exp || "nunca"; save(); }
  if (id === "lesson3") return go("lesson", { lvl: 2, step: 0 });
  if (id === "leap") { if (!allDone()) { S.done = [0, 1, 2, 3, 4, 5]; save(); } go("leap"); confetti(); return; }
  if (id === "diag") return go("diag", { step: 0 });
  go(id);
}

render();
if (V.page === "leap") confetti();
</script>
